<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story Wall · Julie Torrisi-Coffey</title>
<meta name="robots" content="noindex">
<style>
:root{
  --wall:#18191B; --tile:#222326; --tile-line:rgba(255,255,255,.05); --light:#FFFFFF; --blue:#0866FF;
  --u:128px; --g:20px; --r:20px;
  /* motion tokens (proposed, mirror Eduardo's naming): enter, leave, move, spring for people */
  --out-bold:cubic-bezier(.2,.8,.2,1); --in-practical:cubic-bezier(.4,0,1,1); --inout-bold:cubic-bezier(.6,0,.2,1);
  --spring:cubic-bezier(.34,1.56,.64,1); --tray:300ms;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--wall);overflow:hidden}
body{font-family:-apple-system,system-ui,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
img{display:block;user-select:none;-webkit-user-drag:none}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;background:var(--wall)}
#track{position:absolute;left:0;top:32px;height:1016px;will-change:transform}

/* card frame: appears on the right as an empty box, then its component builds in */
.t{position:absolute;border-radius:var(--r);background:var(--tile);border:1px solid var(--tile-line);overflow:hidden;
  opacity:0;transform:scale(.96);transition:opacity .5s var(--out-bold),transform .5s var(--out-bold)}
.t.light{background:var(--light);border-color:transparent}
.t.blue{background:var(--blue);border-color:transparent}
.t.media{background:#000 center/cover}
.t.media::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.55))}
.t.shown{opacity:1;transform:none}
.t .c{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transform:translateY(10px);transition:opacity .5s var(--out-bold),transform .5s var(--out-bold)}
.t.built .c{opacity:1;transform:none}

/* a slot holds one component at its native size; frames stack inside it */
.slot{position:relative}
.slot>img{position:absolute;left:0;top:0;opacity:0;transition:opacity .4s var(--out-bold)}
.slot>img.on{opacity:1}
.slot.stack>img{transform:translateY(16px);transition:opacity .45s var(--out-bold),transform .45s var(--out-bold)}
.slot.stack>img.on{transform:none}
.slot.reveal>img{opacity:1;clip-path:inset(0 100% 0 0)}
.slot.reveal.up>img{clip-path:inset(100% 0 0 0)}
.slot.reveal.down>img{clip-path:inset(0 0 100% 0)}
.built .slot.reveal>img{transition:clip-path 1.1s var(--out-bold);clip-path:inset(0 0 0 0)}
.slot.tray{overflow:hidden}
.slot.tray>img{opacity:1;transform:translateY(105%);transition:transform var(--tray) var(--out-bold)}
.slot.tray>img.on{transform:none}
.slot.tray>img.off{transform:translateY(105%);transition:transform 250ms var(--in-practical)}
.slot.toast>img{opacity:0;transform:translateY(30px);transition:opacity .35s var(--out-bold),transform .35s var(--out-bold)}
.slot.toast>img.on{opacity:1;transform:none}
.slot.toast>img.off{opacity:0;transform:translateY(-20px);transition:opacity .3s var(--in-practical),transform .3s var(--in-practical)}
.slot.spin>img.on.r0{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.row{display:flex;align-items:center;gap:16px}
.row>img{transform:scale(0);transition:transform .45s var(--spring)}
.row>img.on{transform:scale(1)}

/* brand assets */
.brand{width:72%;height:72%;object-fit:contain}
.brand.sm{width:58%;height:58%}
.app{width:52px;height:52px;border-radius:12px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))}
.bvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fb{width:96px;height:96px}

/* cursors */
#cursors{position:absolute;inset:0;pointer-events:none;z-index:20}
.cur{position:absolute;left:0;top:0;opacity:0;transition:opacity .3s}
.cur svg{width:24px;height:24px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.cur span{position:absolute;left:16px;top:20px;white-space:nowrap;font:600 14px/1 -apple-system,system-ui,sans-serif;color:#fff;padding:6px 9px;border-radius:4px 11px 11px 11px;
  transform:scale(0);transform-origin:0 0;transition:transform .4s var(--spring)}
.cur.in{opacity:1}.cur.named span{transform:scale(1)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="stage"><div id="track"></div><div id="cursors"></div></div>
<script>
(()=>{
const stage=document.getElementById('stage'),track=document.getElementById('track');
const fit=()=>{const k=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`translate(-50%,-50%) scale(${k})`};addEventListener('resize',fit);fit();
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const META={"cmt-1":[375,137],"cmt-2":[375,137],"cmt-3":[375,137],"cmtm-att":[375,237],"cmtm-reply":[375,130],"cmtc-ok":[375,130],"cmtc-err":[375,105],"thr-c":[375,137],"thr-e":[375,657],"abar":[375,24],"fp-1":[375,40],"fp-2":[375,40],"fp-3":[375,40],"sb-1":[55,16],"sb-2":[72,16],"sb-3":[55,16],"csb-1":[58,16],"csb-2":[58,16],"csb-3":[56,16],"ssb-1":[56,16],"ssb-2":[65,16],"ssb-3":[62,16],"ex-100":[100,100],"ex-60":[60,60],"ex-40":[40,40],"ex-32":[32,32],"ex-24":[24,24],"ex-20":[20,20],"ex-16":[16,16],"note-bl":[175,81],"note-br":[175,81],"note-tl":[175,81],"note-tr":[175,81],"chat-o":[375,75],"chat-y":[375,75],"bling-d":[375,36],"bling-p":[375,36],"ring-i":[32,32],"ring-d":[32,32],"pbar":[375,20],"ctx-4":[375,150],"ntf-u":[375,96],"ntf-r":[375,96],"pbc-1":[375,35],"pbc-2":[375,58],"pbc-3":[375,81],"pbc-4":[375,104],"pbc-5":[375,127],"pbs-5":[375,127],"donut-h":[375,91],"bar-v":[375,248],"bar-h":[375,210],"cmp-d":[375,60],"cmp-a":[375,56],"cmp-t":[375,56],"cmpl-d":[375,64],"cmpl-a":[375,56],"cmpl-t":[375,56],"card-e":[375,120],"card-d":[375,120],"sw-off":[51,31],"sw-on":[51,31],"chip-d":[86,36],"chip-s":[112,36],"chipm-d":[86,36],"chipm-s":[112,36],"tray-st":[402,436],"tray-cr":[402,336],"star-0":[177,55],"star-1":[177,55],"star-2":[177,55],"star-3":[177,55],"star-4":[177,55],"star-5":[177,55],"star-6":[177,55],"star-7":[177,55],"star-8":[177,55],"star-9":[177,55],"rate-0":[375,110],"rate-1":[375,110],"rate-2":[375,110],"rate-3":[375,110],"rate-4":[375,110],"rate-5":[375,110],"tab-1":[375,76],"tab-2":[375,76],"tab-3":[375,76],"tab-4":[375,76],"tab-5":[375,76],"dots-1":[62,24],"dots-2":[62,24],"dots-3":[62,24],"dots-4":[62,24],"dots-5":[62,24],"ufi-only":[43,20],"ufi-count":[43,20],"ufi-liked":[43,20],"ufi-love":[43,20],"ufi-care":[43,20],"ufi-haha":[43,20],"ufi-wow":[43,20],"ufi-sad":[43,20],"ufi-angry":[43,20]};
const B=n=>'bp/'+n+'.png';
const U=128,G=20,ROWS=7,VW=1920;
const px=n=>n*U+(n-1)*G;

/* ---------- the pool: real Blueprint components (exported as-is) + official Facebook brand assets ----------
   type: cycle (swap variants in place), stack (variants add one under another), reveal (wipe in on enter, then hold),
   tray (rises 300 ms ease-out), toast (in, hold, out), row (pop in on a spring), brand / app / video. */
const POOL=[
 {k:'fb-logo',w:2,h:2,type:'fb'},
 {k:'comment-stack',w:3,h:4,theme:'light',type:'stack',f:['cmt-1','cmt-2','cmt-3'],gap:0,ms:900},
 {k:'app-claude',w:1,h:1,type:'app',src:'bp/app-claude.png'},
 {k:'ufi-reaction',w:1,h:1,theme:'light',type:'cycle',f:['ufi-only','ufi-count','ufi-liked','ufi-love','ufi-care','ufi-haha','ufi-wow','ufi-sad','ufi-angry'],ms:650},
 {k:'bar-vertical',w:3,h:2,theme:'light',type:'reveal',f:['bar-v'],dir:'up'},
 {k:'like',w:2,h:2,type:'brand',src:'../img/fb/like-anim.webp'},
 {k:'composer',w:3,h:1,theme:'light',type:'cycle',f:['cmp-d','cmp-a','cmp-t'],ms:1200},
 {k:'signal-badge',w:2,h:1,theme:'light',type:'cycle',f:['sb-1','sb-2','sb-3'],ms:1100},
 {k:'thread',w:3,h:5,theme:'light',type:'cycle',f:['thr-c','thr-e'],ms:2600,align:'top'},
 {k:'app-figma',w:1,h:1,type:'app',src:'bp/app-figma.png'},
 {k:'switch',w:1,h:1,theme:'light',type:'cycle',f:['sw-off','sw-on'],ms:1000},
 {k:'comment-media',w:3,h:3,theme:'media',bg:'img/media-4.webp',type:'stack',f:['cmtm-att','cmtm-reply'],gap:6,ms:1200},
 {k:'expressive',w:5,h:1,type:'row',f:['ex-16','ex-20','ex-24','ex-32','ex-40','ex-60','ex-100'],ms:140},
 {k:'care',w:2,h:2,type:'brand',src:'../img/fb/care-anim.webp'},
 {k:'notification',w:3,h:1,theme:'light',type:'cycle',f:['ntf-u','ntf-r'],ms:1600},
 {k:'progress-chart',w:3,h:2,theme:'light',type:'cycle',f:['pbc-1','pbc-2','pbc-3','pbc-4','pbc-5'],ms:700,align:'top'},
 {k:'love',w:1,h:1,type:'brand',sm:1,src:'../img/fb/love.webp',pop:1},
 {k:'app-cursor',w:1,h:1,type:'app',src:'bp/app-cursor.png'},
 {k:'note-bubble',w:2,h:1,theme:'light',type:'cycle',f:['note-bl','note-br','note-tr','note-tl'],ms:900},
 {k:'tray-stickers',w:3,h:4,theme:'light',type:'tray',f:['tray-st'],ms:3200},
 {k:'facepile',w:3,h:1,theme:'light',type:'cycle',f:['fp-1','fp-2','fp-3'],ms:900},
 {k:'rock-on',w:2,h:2,type:'brand',src:'../img/fb/rock-on-anim.webp'},
 {k:'progress-ring',w:1,h:1,theme:'light',type:'cycle',f:['ring-i','ring-d'],ms:1800,spin:1},
 {k:'chat',w:3,h:2,theme:'light',type:'stack',f:['chat-o','chat-y'],gap:10,ms:1100},
 {k:'bling-bar',w:3,h:1,theme:'light',type:'cycle',f:['bling-d','bling-p'],ms:1600},
 {k:'comment-color',w:3,h:2,theme:'blue',type:'cycle',f:['cmtc-ok','cmtc-err'],ms:1800},
 {k:'app-xcode',w:1,h:1,type:'app',src:'bp/app-xcode.png'},
 {k:'bar-horizontal',w:3,h:2,theme:'light',type:'reveal',f:['bar-h']},
 {k:'star',w:2,h:2,type:'brand',src:'../img/fb/star-anim.webp'},
 {k:'contextual-message',w:3,h:2,theme:'light',type:'toast',f:['ctx-4'],ms:2400},
 {k:'tab-bar',w:3,h:1,theme:'light',type:'cycle',f:['tab-1','tab-2','tab-3','tab-4','tab-5'],ms:800},
 {k:'wow',w:1,h:1,type:'brand',sm:1,src:'../img/fb/wow.webp',pop:1},
 {k:'creator-badges',w:2,h:1,theme:'light',type:'stack',f:['csb-1','csb-2','csb-3'],gap:8,ms:500},
 {k:'star-display',w:2,h:1,theme:'light',type:'cycle',f:['star-0','star-1','star-2','star-3','star-4','star-5','star-6','star-7','star-8','star-9'],ms:260,hold:1},
 {k:'app-testflight',w:1,h:1,type:'app',src:'bp/app-testflight.png'},

 {k:'composer-live',w:3,h:1,theme:'media',bg:'img/media-5.webp',type:'cycle',f:['cmpl-d','cmpl-a','cmpl-t'],ms:1200},
 {k:'unicorn',w:2,h:2,type:'brand',src:'../img/fb/unicorn-anim.webp'},
 {k:'progress-bar',w:3,h:1,theme:'light',type:'reveal',f:['pbar'],loop:2600},
 {k:'tray-camera',w:3,h:3,theme:'light',type:'tray',f:['tray-cr'],ms:3000},
 {k:'pagination',w:1,h:1,theme:'light',type:'cycle',f:['dots-1','dots-2','dots-3','dots-4','dots-5'],ms:700},
 {k:'social-badges',w:2,h:1,theme:'light',type:'stack',f:['ssb-1','ssb-2','ssb-3'],gap:8,ms:500},
 {k:'rating-chart',w:3,h:2,theme:'light',type:'reveal',f:['pbs-5']},
 {k:'fire',w:1,h:1,type:'brand',sm:1,src:'../img/fb/fire.webp',pop:1},
 {k:'card-composer',w:3,h:1,theme:'light',type:'cycle',f:['card-e','card-d'],ms:1500},
 {k:'app-simulator',w:1,h:1,type:'app',src:'bp/app-simulator.png'},
 {k:'croc',w:2,h:2,type:'brand',src:'../img/fb/croc-anim.webp'},
 {k:'donut-header',w:3,h:1,theme:'light',type:'reveal',f:['donut-h']},
 {k:'rating-input',w:3,h:1,theme:'light',type:'cycle',f:['rate-0','rate-1','rate-2','rate-3','rate-4','rate-5'],ms:420,hold:1},
 {k:'chips',w:2,h:1,theme:'light',type:'cycle',f:['chip-d','chip-s'],ms:1200},
 {k:'action-bar',w:3,h:1,theme:'light',type:'reveal',f:['abar']},
 {k:'verified',w:1,h:1,type:'brand',sm:1,src:'../img/fb/badge-check.webp',pop:1},
 {k:'app-terminal',w:1,h:1,type:'app',src:'bp/app-terminal.png'},
 {k:'chat-badge',w:1,h:1,type:'brand',sm:1,src:'../img/fb/badge-chat.webp',pop:1},
 {k:'map-icon',w:1,h:1,type:'brand',sm:1,src:'../img/fb/map.webp',pop:1},
];

/* ---------- dense packer on a 7-row grid; keeps going forever ---------- */
const occ=[];const cell=(c,r)=>occ[c]&&occ[c][r];
let firstOpen=0,poolIx=0;const items=[];
function fits(c,r,w,h){if(r+h>ROWS)return false;for(let i=c;i<c+w;i++)for(let j=r;j<r+h;j++)if(cell(i,j))return false;return true}
function place(spec){for(let c=firstOpen;;c++){for(let r=0;r<ROWS;r++){if(fits(c,r,spec.w,spec.h)){
  for(let i=c;i<c+spec.w;i++){occ[i]=occ[i]||[];for(let j=r;j<r+spec.h;j++)occ[i][j]=1}
  while(occ[firstOpen]&&occ[firstOpen].filter(Boolean).length===ROWS)firstOpen++;
  return {spec,c,r,x:c*(U+G),y:r*(U+G),w:px(spec.w),h:px(spec.h)};}}}}
function ensure(maxX){while(!items.length||items[items.length-1].x<maxX){items.push(place(POOL[poolIx%POOL.length]));poolIx++;}}

/* ---------- build a card's DOM and its program ---------- */
const at=(list,ms,fn)=>list.push(setTimeout(fn,ms));
function slotFor(s,cls){const el=document.createElement('div');el.className='slot '+(cls||'');
  const ws=s.f.map(n=>META[n][0]),hs=s.f.map(n=>META[n][1]);
  if(s.type==='stack'){el.style.width=Math.max(...ws)+'px';el.style.height=(hs.reduce((a,b)=>a+b,0)+(s.gap||0)*(hs.length-1))+'px';}
  else{el.style.width=Math.max(...ws)+'px';el.style.height=Math.max(...hs)+'px';}
  let y=0;s.f.forEach((n,i)=>{const im=new Image();im.src=B(n);im.width=META[n][0];im.height=META[n][1];if(s.type==='stack'){im.style.top=y+'px';y+=META[n][1]+(s.gap||0)}
    if(s.spin&&i===0)im.classList.add('r0');el.appendChild(im)});return el;}
function make(it){const s=it.spec,t=document.createElement('div');t.className='t'+(s.theme?' '+s.theme:'');
  t.style.cssText=`left:${it.x}px;top:${it.y}px;width:${it.w}px;height:${it.h}px`;if(s.bg)t.style.backgroundImage=`url(${s.bg})`;
  const c=document.createElement('div');c.className='c';t.appendChild(c);
  let slot=null;
  if(s.type==='fb')c.innerHTML='<svg class="fb" viewBox="0 0 64 64"><circle cx="32" cy="32" r="32" fill="#0866FF"/><path d="M36.4 64V39.6h7.3l1.1-8.5h-8.4v-5.4c0-2.5.7-4.1 4.2-4.1H45v-7.6c-.8-.1-3.4-.3-6.5-.3-6.4 0-10.8 3.9-10.8 11.1v6.3h-7.3v8.5h7.3V64z" fill="#fff"/></svg>';
  else if(s.type==='app')c.innerHTML=`<img class="app" src="${s.src}" alt="">`;
  else if(s.type==='brand')c.innerHTML=`<img class="brand${s.sm?' sm':''}" src="${s.src}" alt="">`;
  else if(s.type==='video')c.innerHTML=`<video class="bvid" src="${s.src}" muted playsinline loop preload="auto"></video>`;
  else if(s.type==='row'){slot=document.createElement('div');slot.className='row';s.f.forEach(n=>{const im=new Image();im.src=B(n);im.width=META[n][0];im.height=META[n][1];slot.appendChild(im)});c.appendChild(slot)}
  else{slot=slotFor(s,s.type+(s.dir?' '+s.dir:'')+(s.spin?' spin':''));c.appendChild(slot);if(s.align==='top'){c.style.placeItems='start center';c.style.paddingTop=Math.max(16,(it.h-slot.offsetHeight)/2|0)+'px'}}
  it.el=t;it.slot=slot;it.timers=[];track.appendChild(t);
  if(s.align==='top'&&slot){const mh=Math.max(...s.f.map(n=>META[n][1]));c.style.paddingTop=Math.max(20,((it.h-mh)/2)|0)+'px'}
}
function run(it){const s=it.spec,T=it.timers,sl=it.slot;if(reduce){if(sl)[...sl.children].forEach(x=>x.classList.add('on'));return}
  const kids=sl?[...sl.children]:[];
  if(s.type==='cycle'){let i=0;kids[0].classList.add('on');
    const step=()=>{if(s.hold&&i===kids.length-1){at(T,s.ms*6,()=>{kids[i].classList.remove('on');i=0;kids[0].classList.add('on');at(T,s.ms,step)});return}
      kids[i].classList.remove('on');i=(i+1)%kids.length;kids[i].classList.add('on');at(T,s.ms,step)};at(T,s.ms,step);}
  else if(s.type==='stack'){const go=()=>{kids.forEach(k=>k.classList.remove('on'));kids.forEach((k,i)=>at(T,200+i*s.ms,()=>k.classList.add('on')));at(T,200+kids.length*s.ms+2600,go)};go();}
  else if(s.type==='row'){const go=()=>{kids.forEach(k=>k.classList.remove('on'));kids.forEach((k,i)=>at(T,200+i*s.ms,()=>k.classList.add('on')));at(T,200+kids.length*s.ms+3200,go)};go();}
  else if(s.type==='tray'){const k=kids[0];const go=()=>{k.classList.remove('off');k.classList.add('on');at(T,s.ms,()=>{k.classList.remove('on');k.classList.add('off')});at(T,s.ms+900,go)};at(T,250,go);}
  else if(s.type==='toast'){const k=kids[0];const go=()=>{k.classList.remove('off');k.classList.add('on');at(T,s.ms,()=>{k.classList.remove('on');k.classList.add('off')});at(T,s.ms+1100,()=>{k.classList.remove('off');go()})};at(T,300,go);}
  else if(s.type==='reveal'&&s.loop){const go=()=>{sl.style.transition='none';[...sl.children].forEach(x=>{x.style.transition='none';x.style.clipPath=''});void sl.offsetWidth;it.el.classList.remove('built');void sl.offsetWidth;it.el.classList.add('built');[...sl.children].forEach(x=>x.style.transition='');at(T,s.loop,go)};at(T,s.loop,go);}
  else if(s.type==='video'){const v=it.el.querySelector('video');v&&v.play().catch(()=>{});}
  if(s.pop){const im=it.el.querySelector('img');im.animate([{transform:'scale(.2)'},{transform:'scale(1.15)',offset:.6},{transform:'scale(1)'}],{duration:600,easing:'cubic-bezier(.34,1.56,.64,1)'});}
}
function stop(it){it.timers.forEach(clearTimeout);it.timers=[];}

/* ---------- glide: right to left at Eduardo's speed ----------
   His wall: 0.30 m/s on 5 m tall screens = 0.06 screen heights a second = 64.8 px/s at 1080. */
const SPEED=64.8;let x=VW,last=performance.now();let head=0;const live=[];
function frame(t){const dt=Math.min(.25,(t-last)/1000);last=t;if(!reduce)x-=SPEED*dt;
  track.style.transform=`translate3d(${x.toFixed(2)}px,0,0)`;
  const right=-x+VW;ensure(right+600);
  // create cards just before they reach the right edge; each box appears a beat after it enters
  while(head<items.length&&items[head].x<right+40){const it=items[head++];it.appear=it.x+rnd(40,260);it.state=0;live.push(it);}
  for(let i=live.length-1;i>=0;i--){const it=live[i];const sx=it.x+x;
    if(it.state===0&&it.x<-x+VW-(it.appear-it.x)){make(it);requestAnimationFrame(()=>it.el.classList.add('shown'));it.state=1;
      at(it.timers,rnd(450,900),()=>{it.el.classList.add('built');it.state=2;run(it)});}
    if(sx+it.w<-40){stop(it);it.el&&it.el.remove();live.splice(i,1);}}
  moveCursors(dt);requestAnimationFrame(frame);}
function rnd(a,b){return a+Math.random()*(b-a)}
requestAnimationFrame(frame);

/* ---------- Figma cursors: one or two at a time, in from the nearest edge, out the same way ---------- */
const people=[['Julie','#A259FF'],['Adam','#0ACF83'],['Eduardo','#FF7262'],['Jeremy','#1ABCFE'],['Josh','#F5B400']];
const host=document.getElementById('cursors');
const curs=people.map(([n,c])=>{const d=document.createElement('div');d.className='cur';
  d.innerHTML=`<svg viewBox="0 0 24 24"><path d="M3 2l7.5 19 2.6-7.6L21 10.6z" fill="${c}" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg><span style="background:${c};${n==='Josh'?'color:#1a1a1a':''}">${n}</span>`;
  host.appendChild(d);return {d,busy:false,x:0,y:0,follow:false};});
let who=0;
function moveCursors(dt){curs.forEach(k=>{if(k.follow){k.x-=SPEED*dt;k.d.style.transform=`translate(${k.x}px,${k.y}px)`}})}
function glide(k,tx,ty,ms,e){return new Promise(res=>{const x0=k.x,y0=k.y,t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/ms),q=e(p);k.x=x0+(tx-x0)*q;k.y=y0+(ty-y0)*q;k.d.style.transform=`translate(${k.x}px,${k.y}px)`;p<1?requestAnimationFrame(f):res()})(t0)})}
const eOut=p=>1-Math.pow(1-p,3),eIn=p=>p*p*p;
async function visit(){if(curs.filter(k=>k.busy).length>=2)return;const k=curs[who++%curs.length];if(k.busy)return;
  const cand=live.filter(it=>it.state===2&&it.x+x>260&&it.x+x+it.w<1660);if(!cand.length)return;k.busy=true;
  const it=cand[Math.floor(Math.random()*cand.length)];const tx=it.x+x+it.w*rnd(.3,.7),ty=32+it.y+it.h*rnd(.3,.7);
  const m=Math.min(tx,1920-tx,ty,1080-ty);const [ex,ey]=m===ty?[tx,-40]:m===1080-ty?[tx,1120]:m===tx?[-40,ty]:[1960,ty];
  k.x=ex;k.y=ey;k.d.classList.add('in');await glide(k,tx-SPEED*1.0,ty,1000,eOut);k.d.classList.add('named');k.follow=true;
  await new Promise(r=>setTimeout(r,rnd(2200,3400)));k.follow=false;k.d.classList.remove('named');
  await glide(k,m===tx?-50:m===1920-tx?1970:k.x,m===ty?-50:m===1080-ty?1130:k.y,850,eIn);k.d.classList.remove('in');k.busy=false;}
if(!reduce){setTimeout(visit,4000);setInterval(visit,2800);}
window.__wall={speed:SPEED,pool:POOL.length};
})();
