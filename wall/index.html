<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story Wall · Julie Torrisi-Coffey</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="fonts.css">
<style>
:root{
  --blue:#0866FF; --blue2:#4599FF; --sky:#BEDCFF; --ink:#080809; --gray:#65686C; --wash:#F0F2F5; --line:#E4E6EB;
  --d-bg:#18191A; --d-card:#242526; --d-surf:#3A3B3C; --d-tx:#E4E6EB; --d-tx2:#B0B3B8;
  --purple:#A873FF; --pink:#F35369; --green:#31A24C; --yellow:#F7B928; --teal:#2ABBA7; --red:#E41E3F;
  --wall:#0C0D10; --tile:#16171B; --tile-line:rgba(255,255,255,.06);
  --u:116px; --g:16px; --r:22px;
  --enter:cubic-bezier(.2,.8,.2,1); --leave:cubic-bezier(.4,0,1,1); --move:cubic-bezier(.4,0,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --ui:"Inter",-apple-system,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--wall);overflow:hidden}
body{font-family:var(--ui);-webkit-font-smoothing:antialiased;color:var(--d-tx)}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;background:
  radial-gradient(900px 600px at 10% 0%,rgba(8,102,255,.10),transparent 60%),radial-gradient(900px 600px at 95% 100%,rgba(168,115,255,.09),transparent 60%),var(--wall)}
.track{position:absolute;top:20px;left:0;display:flex;gap:var(--g);will-change:transform}
.set{display:grid;grid-template-rows:repeat(8,var(--u));grid-auto-columns:var(--u);grid-auto-flow:column dense;gap:var(--g)}
.t{position:relative;border-radius:var(--r);background:var(--tile);border:1px solid var(--tile-line);overflow:hidden;display:grid;place-items:center;
   box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.t.glow{box-shadow:0 0 0 1px rgba(69,153,255,.25),0 0 40px rgba(8,102,255,.18)}
/* spans */
.w1{grid-column:span 1}.w2{grid-column:span 2}.w3{grid-column:span 3}.w4{grid-column:span 4}.w5{grid-column:span 5}
.h1{grid-row:span 1}.h2{grid-row:span 2}.h3{grid-row:span 3}.h4{grid-row:span 4}.h5{grid-row:span 5}
img{display:block}
svg{display:block}

/* ---------- Facebook icon: tap, launch, settle ---------- */
.fbi{width:150px;height:150px;border-radius:36px;background:var(--blue);display:grid;place-items:center;box-shadow:0 20px 50px rgba(8,102,255,.45);
  animation:fbtap 6s var(--move) infinite}
.fbi svg{width:96px;height:96px}
@keyframes fbtap{0%,8%{transform:scale(1)}12%{transform:scale(.86)}18%{transform:scale(1.04)}22%,100%{transform:scale(1)}}
.splash{position:absolute;inset:0;background:#fff;display:grid;place-items:center;clip-path:circle(0% at 50% 50%);animation:splash 6s var(--enter) infinite}
.splash svg{width:84px;height:84px;animation:splashf 6s var(--spring) infinite}
@keyframes splash{0%,20%{clip-path:circle(0% at 50% 50%)}32%,62%{clip-path:circle(75% at 50% 50%)}74%,100%{clip-path:circle(0% at 50% 50%)}}
@keyframes splashf{0%,24%{transform:scale(.3);opacity:0}36%{transform:scale(1);opacity:1}60%{transform:scale(1)}66%,100%{transform:scale(.6);opacity:0}}

/* ---------- Top nav header ---------- */
.nav{width:88%;display:flex;align-items:center;justify-content:space-between}
.wm{font:800 44px/1 var(--ui);letter-spacing:-2px;color:#fff;clip-path:inset(0 100% 0 0);animation:wm 7s var(--enter) infinite}
@keyframes wm{0%,6%{clip-path:inset(0 100% 0 0)}22%,88%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 0 0)}}
.hb{display:flex;gap:10px}.hb i{width:48px;height:48px;border-radius:50%;background:var(--d-surf);display:grid;place-items:center;animation:hb 7s var(--spring) infinite}
.hb i:nth-child(2){animation-delay:.08s}.hb i:nth-child(3){animation-delay:.16s}
.hb svg{width:24px;height:24px}
@keyframes hb{0%,14%{transform:scale(0)}24%,92%{transform:scale(1)}100%{transform:scale(0)}}

/* ---------- Bottom tab bar ---------- */
.tabs{position:relative;width:90%;display:flex;justify-content:space-between;padding:10px 6px 14px}
.tabs span{display:grid;place-items:center;width:52px;height:44px;transition:transform .35s var(--spring)}
.tabs svg{width:30px;height:30px;color:var(--d-tx2);transition:color .25s}
.tabs .on svg{color:var(--blue2)}.tabs .on{transform:scale(1.12)}
.tabs .bar{position:absolute;bottom:0;left:0;height:4px;width:52px;border-radius:4px;background:var(--blue2);transition:transform .4s var(--move)}
.tabs .dot{position:absolute;top:4px;width:10px;height:10px;border-radius:50%;background:var(--red);border:2px solid var(--tile)}

/* ---------- Comment: light / dark / live ---------- */
.cmt{position:absolute;inset:0;padding:34px 30px;display:flex;flex-direction:column;justify-content:center;gap:16px;transition:background .6s var(--move),color .6s var(--move)}
.cmt video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s}
.cmt .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.1),rgba(0,0,0,.6));opacity:0;transition:opacity .6s}
.row{position:relative;display:flex;gap:10px}
.av{width:44px;height:44px;border-radius:50%;flex:none;background:center/cover}
.bub{border-radius:20px;padding:10px 14px;transition:background .6s}
.nm{font:600 15px/1.25 var(--ui);display:flex;align-items:center;gap:5px}
.tx{font:400 16px/1.35 var(--ui);margin-top:2px}
.mn{font-weight:600}
.meta{display:flex;align-items:center;gap:16px;margin:7px 0 0 14px;font:600 13px/1 var(--ui);transition:color .6s}
.rx{margin-left:auto;display:flex;align-items:center;gap:6px}.rx img{width:20px;height:20px;border-radius:50%}
.reply{margin-left:54px}.reply .av{width:32px;height:32px}
.cmt[data-m="light"]{background:#fff;color:var(--ink)}.cmt[data-m="light"] .bub{background:var(--wash)}.cmt[data-m="light"] .meta{color:var(--gray)}.cmt[data-m="light"] .mn{color:var(--blue)}
.cmt[data-m="dark"]{background:var(--d-card);color:var(--d-tx)}.cmt[data-m="dark"] .bub{background:var(--d-surf)}.cmt[data-m="dark"] .meta{color:var(--d-tx2)}.cmt[data-m="dark"] .mn{color:var(--blue2)}
.cmt[data-m="live"]{background:#000;color:#fff}.cmt[data-m="live"] video,.cmt[data-m="live"] .scrim{opacity:1}
.cmt[data-m="live"] .bub{background:rgba(255,255,255,.16);backdrop-filter:blur(14px)}.cmt[data-m="live"] .meta{color:rgba(255,255,255,.85)}.cmt[data-m="live"] .mn{color:#fff;text-decoration:underline}
.ck{width:14px;height:14px}

/* ---------- Pinned comment ---------- */
.pin{width:88%;display:flex;flex-direction:column;gap:10px}
.pin .lab{display:flex;align-items:center;gap:6px;font:600 13px/1 var(--ui);color:var(--d-tx2);opacity:0;transform:translateY(6px);animation:pinlab 6s var(--enter) infinite}
.pin .lab svg{width:15px;height:15px;transform:rotate(-30deg);animation:pinic 6s var(--spring) infinite}
@keyframes pinlab{0%,22%{opacity:0;transform:translateY(6px)}30%,90%{opacity:1;transform:none}100%{opacity:0}}
@keyframes pinic{0%,24%{transform:rotate(-30deg) scale(.2)}34%,90%{transform:rotate(0) scale(1)}100%{transform:rotate(0) scale(1)}}
.pin .bub{background:var(--d-surf);color:var(--d-tx)}
.pin .row{animation:pinrow 6s var(--move) infinite}
@keyframes pinrow{0%,12%{transform:translateY(46px)}24%,100%{transform:none}}
.toast{position:absolute;left:50%;bottom:16px;transform:translate(-50%,30px);opacity:0;background:#fff;color:var(--ink);font:500 13px/1 var(--ui);padding:10px 14px;border-radius:10px;white-space:nowrap;
  box-shadow:0 8px 24px rgba(0,0,0,.4);animation:toast 6s var(--enter) infinite}
@keyframes toast{0%,30%{opacity:0;transform:translate(-50%,30px)}38%,70%{opacity:1;transform:translate(-50%,0)}78%,100%{opacity:0;transform:translate(-50%,10px)}}

/* ---------- Nickname: identity swap ---------- */
.nick{width:86%;display:flex;align-items:center;gap:14px;background:var(--d-card);border-radius:16px;padding:14px 16px}
.nick .avs{position:relative;width:52px;height:52px;flex:none}
.nick .avs i{position:absolute;inset:0;border-radius:50%;background:center/cover;transition:transform .5s var(--spring),opacity .4s}
.nick .names{position:relative;flex:1;height:40px;overflow:hidden}
.nick .names div{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;transition:transform .5s var(--enter),opacity .4s}
.nick b{font:600 16px/1.2 var(--ui)}.nick small{font:400 13px/1.3 var(--ui);color:var(--d-tx2)}
.nick .sw{flex:none}
.nick[data-s="0"] .a2,.nick[data-s="1"] .a1{transform:scale(.4);opacity:0}
.nick[data-s="0"] .n2{transform:translateY(100%);opacity:0}.nick[data-s="1"] .n1{transform:translateY(-100%);opacity:0}

/* ---------- Switch (Blueprint .Switch) ---------- */
.sw{position:relative;width:52px;height:30px;border-radius:15px;background:#8A8D91;transition:background .3s var(--move)}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .35s var(--spring)}
.sw.on{background:var(--blue)}.sw.on::after{transform:translateX(22px)}

/* ---------- Toggle list cell with avatar ---------- */
.cell{width:88%;display:flex;flex-direction:column;gap:12px}
.cell .r{display:flex;align-items:center;gap:14px;background:var(--d-card);border-radius:16px;padding:12px 16px}
.cell .av{width:48px;height:48px;box-shadow:0 0 0 2px var(--d-card),0 0 0 4px transparent;transition:box-shadow .4s}
.cell .r.lit .av{box-shadow:0 0 0 2px var(--d-card),0 0 0 4px var(--blue)}
.cell .ln{flex:1;display:flex;flex-direction:column;gap:7px}.cell .ln i{height:9px;border-radius:5px;background:var(--d-surf)}.cell .ln i:first-child{width:70%;background:#4E4F50}.cell .ln i:last-child{width:45%}

/* ---------- Responsive post ---------- */
.post{width:92%;background:var(--d-card);border-radius:18px;overflow:hidden;animation:resp 8s var(--move) infinite}
@keyframes resp{0%,15%{width:92%}35%,55%{width:62%}75%,100%{width:92%}}
.post .hd{display:flex;align-items:center;gap:10px;padding:14px}
.post .hd .av{width:40px;height:40px}
.post .ln{flex:1;display:flex;flex-direction:column;gap:6px}.post .ln i{height:9px;border-radius:5px;background:#4E4F50;width:55%}.post .ln i+i{background:var(--d-surf);width:32%}
.post .copy{padding:0 14px 12px;display:flex;flex-direction:column;gap:7px}.post .copy i{height:9px;border-radius:5px;background:var(--d-surf)}.post .copy i:last-child{width:62%}
.post .media{aspect-ratio:4/3;background:url(img/media-2.webp) center/cover;transition:aspect-ratio .6s}
.post .ufi{display:flex;justify-content:space-around;padding:12px 8px;border-top:1px solid #3E4042}
.post .ufi svg{width:22px;height:22px;color:var(--d-tx2)}
.post .cnt{display:flex;align-items:center;gap:6px;padding:10px 14px;font:500 13px/1 var(--ui);color:var(--d-tx2)}
.post .cnt img{width:18px;height:18px;border-radius:50%}.post .cnt img+img{margin-left:-8px}

/* ---------- Media tile (advanced) ---------- */
.mt{width:46%;background:var(--d-card);border-radius:14px;overflow:hidden;transition:transform .5s var(--spring)}
.mts{display:flex;gap:4%;width:90%;justify-content:center}
.mt .img{position:relative;aspect-ratio:1;background:center/cover}
.mt .badge{position:absolute;left:8px;top:8px;font:700 11px/1 var(--ui);color:#fff;background:var(--red);padding:5px 7px;border-radius:5px;transform:scale(0);transition:transform .4s var(--spring)}
.mt .dur{position:absolute;right:8px;bottom:8px;font:600 11px/1 var(--ui);color:#fff;background:rgba(0,0,0,.6);padding:4px 6px;border-radius:5px;opacity:0;transition:opacity .3s}
.mt .play{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:rgba(0,0,0,.5);display:grid;place-items:center;transform:scale(0);transition:transform .4s var(--spring)}
.mt .x{position:absolute;right:8px;top:8px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;opacity:0;transition:opacity .3s}
.mt .bd{padding:10px 10px 12px;display:flex;flex-direction:column;gap:6px}
.mt .bd i{height:8px;border-radius:4px;background:#4E4F50;width:80%}.mt .bd i+i{background:var(--d-surf);width:60%}
.mt .st{display:flex;gap:2px}.mt .st b{width:11px;height:11px;background:#E07B00;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.mt .st b.o{background:#55575A}
.mt .lbl{width:38px!important;height:14px!important;border-radius:4px!important;background:#4E4F50!important}
.mts[data-v="1"] .badge,.mts[data-v="1"] .dur{transform:scale(1);opacity:1}
.mts[data-v="2"] .play{transform:scale(1)}.mts[data-v="2"] .dur{opacity:1}
.mts[data-v="3"] .x{opacity:1}.mts[data-v="3"] .mt:first-child{transform:scale(1.04)}

/* ---------- Progress ---------- */
.pb{width:86%;display:flex;flex-direction:column;gap:14px}
.pb .r{display:grid;grid-template-columns:1fr 36px;gap:10px;align-items:center;font:600 13px/1 var(--ui);color:var(--d-tx2);font-variant-numeric:tabular-nums}
.pb .tr{height:10px;border-radius:10px;background:var(--d-surf);overflow:hidden}
.pb .tr i{display:block;height:100%;border-radius:10px;transform-origin:left;animation:fillx 6s var(--enter) infinite}
@keyframes fillx{0%{transform:scaleX(0)}24%,86%{transform:scaleX(1)}100%{transform:scaleX(0)}}
.one{width:86%}
.one .tr{height:8px;border-radius:8px;background:var(--d-surf);overflow:hidden}
.one .tr i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--blue),var(--purple));transform-origin:left;animation:upl 4s var(--move) infinite}
@keyframes upl{0%{transform:scaleX(0)}70%,90%{transform:scaleX(1)}100%{transform:scaleX(0)}}
.ringw{position:relative;width:150px;height:150px}
.ringw svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringw .v{position:absolute;inset:0;display:grid;place-items:center;font:700 30px/1 var(--ui);color:#fff;font-variant-numeric:tabular-nums}
.arc{stroke-dasharray:1;stroke-dashoffset:1;animation:arc 5s var(--enter) infinite}
@keyframes arc{0%{stroke-dashoffset:1}60%,88%{stroke-dashoffset:.18}100%{stroke-dashoffset:1}}

/* ---------- Numbered badge ---------- */
.bell{position:relative;width:96px;height:96px;border-radius:50%;background:var(--d-surf);display:grid;place-items:center}
.bell svg{width:50px;height:50px;color:var(--d-tx);transform-origin:50% 10%}
.bell.ring svg{animation:ringb .7s var(--move)}
@keyframes ringb{20%{transform:rotate(14deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}80%{transform:rotate(-4deg)}}
.nb{position:absolute;right:-4px;top:-4px;min-width:38px;height:38px;padding:0 9px;border-radius:19px;background:var(--red);color:#fff;font:700 19px/38px var(--ui);text-align:center;
  border:3px solid var(--tile);font-variant-numeric:tabular-nums;transition:transform .35s var(--spring)}
.nb.bump{transform:scale(1.25)}

/* ---------- Reaction count ---------- */
.rcount{display:flex;align-items:center;gap:12px;background:var(--d-card);padding:12px 18px;border-radius:40px}
.rcount .fp{display:flex}.rcount .fp img{width:34px;height:34px;border-radius:50%;border:3px solid var(--d-card);animation:fp 4s var(--spring) infinite}
.rcount .fp img+img{margin-left:-10px}.rcount .fp img:nth-child(2){animation-delay:.1s}.rcount .fp img:nth-child(3){animation-delay:.2s}
@keyframes fp{0%,70%,100%{transform:none}78%{transform:translateY(-6px) scale(1.12)}}
.rcount b{font:700 22px/1 var(--ui);color:var(--d-tx);font-variant-numeric:tabular-nums;min-width:74px}

/* ---------- Reactions + stickers ---------- */
.rx1{width:72%;height:72%;object-fit:contain}
.pop{width:58%;animation:popr 3s var(--spring) infinite}
@keyframes popr{0%,55%,100%{transform:scale(1)}65%{transform:scale(1.3) rotate(-6deg)}78%{transform:scale(.94)}}
.vb{width:52%}.vb.a{animation:popr 3.4s var(--spring) infinite .6s}

/* ---------- Flower + orbiting reactions ---------- */
.flw{position:relative;width:100%;height:100%;display:grid;place-items:center}
.flw .fl{height:76%;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.flw .orb{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;animation:orbit 9s linear infinite}
.flw .orb img{width:100%;height:100%;animation:counter 9s linear infinite}
@keyframes orbit{from{transform:rotate(0) translateX(116px)}to{transform:rotate(360deg) translateX(116px)}}
@keyframes counter{from{transform:rotate(0)}to{transform:rotate(-360deg)}}

.trio{position:relative;width:100%;height:100%}
.trio img{position:absolute;border-radius:50%;filter:drop-shadow(0 14px 24px rgba(0,0,0,.45));animation:trio 4.5s var(--spring) infinite}
.trio .t1{width:38%;left:12%;top:44%}.trio .t2{width:34%;left:54%;top:12%;animation-delay:.25s}.trio .t3{width:20%;left:66%;top:66%;animation-delay:.5s}
@keyframes trio{0%,8%{transform:scale(0) rotate(-20deg)}22%{transform:scale(1.12) rotate(4deg)}30%,80%{transform:scale(1) rotate(0)}92%,100%{transform:scale(0)}}
/* ---------- 3D art ---------- */
.art{width:78%;height:78%;object-fit:contain;animation:bob 6s ease-in-out infinite;filter:drop-shadow(0 24px 30px rgba(0,0,0,.5))}
@keyframes bob{0%,100%{transform:translateY(-6px) rotate(-2deg)}50%{transform:translateY(8px) rotate(2deg)}}

/* ---------- Charts ---------- */
.ch{width:84%}
.ch svg{width:100%;height:auto;overflow:visible}
.grow{transform-box:fill-box;transform-origin:bottom;animation:grow 6s var(--enter) infinite}
@keyframes grow{0%{transform:scaleY(0)}20%,86%{transform:scaleY(1)}100%{transform:scaleY(0)}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 6s var(--move) infinite}
@keyframes draw{0%{stroke-dashoffset:1}32%,86%{stroke-dashoffset:0}100%{stroke-dashoffset:1}}
.seg{animation:draw 6s var(--enter) infinite}
.stars{display:flex;gap:8px;align-items:center}.stars svg{width:40px;height:40px}
.stars .fillr{transform-box:fill-box;transform-origin:left;animation:fillx 6s var(--enter) infinite}
.hbar{display:flex;flex-direction:column;gap:9px;width:86%}
.hbar div{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--d-surf)}
.hbar i{display:block;height:100%;transform-origin:left;animation:fillx 6s var(--enter) infinite}

/* ---------- Talk to text ---------- */
.ttt{position:relative;width:90%;height:56px}
.ttt>div{position:absolute;inset:0;display:flex;align-items:center;gap:12px;transition:opacity .25s,transform .3s var(--enter)}
.ttt svg{width:28px;height:28px;flex:none}
.ttt .field{flex:1;height:44px;border-radius:22px;background:var(--d-surf);display:flex;align-items:center;justify-content:flex-end;padding:0 10px}
.ttt .mic{transition:transform .25s var(--spring)}
.ttt .rec{opacity:0}
.ttt .pill{flex:1;height:46px;border-radius:23px;background:var(--blue);display:flex;align-items:center;gap:12px;padding:0 8px;color:#fff;font:600 16px var(--ui);
  transform-origin:right;transform:scaleX(.15);transition:transform .3s var(--enter)}
.ttt .pz{width:32px;height:32px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;gap:4px;flex:none}
.ttt .pz i{width:4px;height:12px;background:var(--blue);border-radius:1px}
.ttt .wave{display:flex;gap:4px;align-items:center;flex:1}
.ttt .wave i{width:4px;height:5px;border-radius:4px;background:#fff;animation:wv .9s ease-in-out infinite}
@keyframes wv{50%{height:20px}}
.ttt .tm{margin-right:10px;font-variant-numeric:tabular-nums}
.ttt.s1 .mic{transform:scale(1.4)}
.ttt.s2 .idle{opacity:0;transform:translateX(-10px)}.ttt.s2 .rec{opacity:1}.ttt.s2 .pill{transform:scaleX(1)}

/* ---------- Messenger composer + keyboard ---------- */
.kbw{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end}
.cbar{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--d-card)}
.cbar .ic{display:flex;gap:12px;overflow:hidden;transition:max-width .35s var(--enter),opacity .25s;max-width:200px}
.cbar svg{width:26px;height:26px;flex:none}
.cbar .chev{max-width:0;overflow:hidden;transition:max-width .35s var(--enter)}
.cbar .fld{flex:1;height:40px;border-radius:20px;background:var(--d-surf);display:flex;align-items:center;padding:0 12px;gap:2px}
.cbar .caret{width:2px;height:20px;background:var(--blue2);opacity:0}
.cbar .typed{font:400 16px/1 var(--ui);color:var(--d-tx);white-space:nowrap;overflow:hidden}
.kb{background:#2C2D2F;padding:8px 5px 10px;display:flex;flex-direction:column;gap:9px;transform:translateY(100%);transition:transform .38s var(--enter)}
.kb .k{display:flex;gap:6px;justify-content:center}
.kb .k i{width:8.4%;height:38px;border-radius:6px;background:#636466;box-shadow:0 1px 0 #1a1a1a;transition:background .08s}

        <svg viewBox="0 0 24 24" fill="#0866FF"><circle cx="12" cy="12" r="10"/><path d="M12 7v10M7 12h10" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>
        <svg viewBox="0 0 24 24" fill="#0866FF"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.4" fill="#16171B"/></svg>
        <svg class="mic" viewBox="0 0 24 24" fill="#0866FF"><rect x="8.5" y="2.5" width="7" height="12" rx="3.5"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" stroke="#0866FF" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
        <div class="field"><svg viewBox="0 0 24 24" fill="#0866FF" style="width:24px;height:24px"><circle cx="12" cy="12" r="10"/><circle cx="9" cy="10" r="1.3" fill="#3A3B3C"/><circle cx="15" cy="10" r="1.3" fill="#3A3B3C"/><path d="M8 14c2 2.5 6 2.5 8 0" stroke="#3A3B3C" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg></div>
        <svg viewBox="0 0 24 24" fill="#0866FF"><path d="M2 10h4v11H2zM8 21h9.5a2 2 0 0 0 2-1.6l1.4-7A2 2 0 0 0 19 10h-5l.8-4.2A2 2 0 0 0 12.9 3.5L8 10z"/></svg>
      </div>
      <div class="rec">
        <svg viewBox="0 0 24 24" fill="#0866FF"><path d="M5 7h14l-1 14H6zM9 4h6l1 2H8z"/></svg>
        <div class="pill"><span class="pz"><i></i><i></i></span><span class="wave"></span><span class="tm">0:00</span></div>
        <svg viewBox="0 0 24 24" fill="#0866FF"><path d="M3 20.5 21.5 12 3 3.5l2.5 7L15 12l-9.5 1.5z"/></svg>
      </div>
    </div>
  </div>

  <!-- 19 Title-slide reactions: like, care, love in sequence -->
  <div class="t w3 h3" data-k="slide-reactions">
    <div class="trio"><img class="t1" src="../img/fb/like-anim.webp" alt=""><img class="t2" src="../img/fb/care-anim.webp" alt=""><img class="t3" src="../img/fb/love.webp" alt=""></div>
  </div>

  <!-- 20 Progress bar chart -->
  <div class="t w3 h2" data-k="chart-progress">
    <div class="pb">
      <div class="r"><div class="tr"><i style="width:92%;background:#0866FF"></i></div><span data-count="92">0</span></div>
      <div class="r"><div class="tr"><i style="width:78%;background:#A873FF;animation-delay:.08s"></i></div><span data-count="78">0</span></div>
      <div class="r"><div class="tr"><i style="width:61%;background:#2ABBA7;animation-delay:.16s"></i></div><span data-count="61">0</span></div>

  <!-- 21 Rock on sticker -->
  <div class="t w2 h2" data-k="sticker-rock-on"><img class="rx1" src="../img/fb/rock-on-anim.webp" alt=""></div>

  <!-- 22 Toggle with Julie in avatar slots -->

      <div class="r" data-tg><div class="av" style="background-image:url(img/julie-av.webp)"></div><div class="ln"><i></i><i></i></div><div class="sw"></div></div>

      <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4599FF"/><stop offset="1" stop-color="#A873FF"/></linearGradient></defs></svg>
      <div class="v"><span data-count="82" data-suf="%">0</span></div></div>
  </div>

  <!-- 24 Messenger composer + keyboard -->

    <div class="kbw">
      <div class="cbar">

          <svg viewBox="0 0 24 24" fill="#0866FF"><circle cx="12" cy="12" r="10"/><path d="M12 7v10M7 12h10" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>
          <svg viewBox="0 0 24 24" fill="#0866FF"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.4" fill="#242526"/></svg>
          <svg viewBox="0 0 24 24" fill="#0866FF"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m5 18 5-6 4 4 2-2 3 4z" fill="#242526"/></svg>
          <svg viewBox="0 0 24 24" fill="#0866FF"><rect x="8.5" y="2.5" width="7" height="12" rx="3.5"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" stroke="#0866FF" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
        </div>
        <div class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="#0866FF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></div>
        <div class="fld"><span class="typed"></span><span class="caret"></span></div>
        <svg viewBox="0 0 24 24" fill="#0866FF"><path d="M2 10h4v11H2zM8 21h9.5a2 2 0 0 0 2-1.6l1.4-7A2 2 0 0 0 19 10h-5l.8-4.2A2 2 0 0 0 12.9 3.5L8 10z"/></svg>
      </div>
      <div class="kb"><div class="k"></div><div class="k"></div><div class="k"></div><div class="k"><i></i><i></i><i></i></div></div>
    </div>
  </div>

  <!-- 25 Star sticker -->
  <div class="t w2 h2" data-k="sticker-star"><img class="rx1" src="../img/fb/star-anim.webp" alt=""></div>
  <!-- 26 TestFlight (gap) -->
  <div class="t w1 h1" data-k="app-testflight"><div class="app gap">Test<br>Flight</div></div>
  <!-- 27 Slack (gap) -->
  <div class="t w1 h1" data-k="app-slack"><div class="app gap">Slack</div></div>

  <!-- 28 Line chart -->
  <div class="t w4 h2" data-k="chart-line">
    <div class="ch"><svg viewBox="0 0 320 110">
      <path d="M0 100H320M0 66H320M0 33H320" stroke="#2C2D30" stroke-width="1"/>
      <path class="draw" pathLength="1" d="M4 92 C40 86 52 70 86 72 S138 40 170 46 S226 20 252 26 S296 8 316 6" fill="none" stroke="#4599FF" stroke-width="4" stroke-linecap="round"/>
      <path class="draw" pathLength="1" d="M4 100 C44 98 60 90 96 88 S150 74 182 76 S238 60 268 62 S300 52 316 50" fill="none" stroke="#A873FF" stroke-width="3" stroke-linecap="round" style="animation-delay:.2s"/>
    </svg></div>
  </div>

  <!-- 29 Media tiles (advanced) -->
  <div class="t w4 h3" data-k="media-tile">
    <div class="mts" data-v="0">
      <div class="mt"><div class="img" style="background-image:url(img/media-2.webp)"><span class="badge">LIVE</span><span class="dur">2:14</span><span class="play"><svg width="16" height="16" viewBox="0 0 10 10"><path d="M2 1v8l7-4z" fill="#fff"/></svg></span><span class="x"><svg width="10" height="10" viewBox="0 0 10 10"><path d="m2 2 6 6M8 2 2 8" stroke="#fff" stroke-width="1.6"/></svg></span></div>
        <div class="bd"><i></i><i></i><div class="st"><b></b><b></b><b></b><b class="o"></b><b class="o"></b></div><i class="lbl"></i></div></div>
      <div class="mt"><div class="img" style="background-image:url(img/media-3.webp)"><span class="badge">NEW</span><span class="dur">0:48</span><span class="play"><svg width="16" height="16" viewBox="0 0 10 10"><path d="M2 1v8l7-4z" fill="#fff"/></svg></span><span class="x"><svg width="10" height="10" viewBox="0 0 10 10"><path d="m2 2 6 6M8 2 2 8" stroke="#fff" stroke-width="1.6"/></svg></span></div>
        <div class="bd"><i></i><i></i><div class="st"><b></b><b></b><b></b><b></b><b class="o"></b></div><i class="lbl"></i></div></div>
    </div>
  </div>

  <!-- 30 3D cursor -->
  <div class="t w3 h3" data-k="3d-strategy"><img class="art" src="img/cursor3d.webp" alt="" style="animation-delay:-2s"></div>

  <!-- 31 Reaction count -->
  <div class="t w3 h1" data-k="reaction-count">
    <div class="rcount"><div class="fp"><img src="../img/fb/like-still.webp" alt=""><img src="../img/fb/love.webp" alt=""><img src="../img/fb/care-still.webp" alt=""></div><b data-tick="1240">1,240</b></div>
  </div>

  <!-- 32 Upload progress -->
  <div class="t w3 h1" data-k="progress-bar"><div class="one"><div class="tr"><i></i></div></div></div>

  <!-- 33 Unicorn sticker -->
  <div class="t w2 h2" data-k="sticker-unicorn"><img class="rx1" src="../img/fb/unicorn-anim.webp" alt=""></div>

  <!-- 34 Nickname identity swap -->
  <div class="t w4 h1" data-k="group-nickname">
    <div class="nick" data-s="0">
      <div class="avs"><i class="a1" style="background-image:url(img/julie-av.webp)"></i><i class="a2" style="background-image:url(../img/fb/ava-buns.webp)"></i></div>
      <div class="names"><div class="n1"><b>Julie</b></div><div class="n2"><b>Glaze Queen</b></div></div>
      <div class="sw"></div>
    </div>
  </div>

  <!-- 35 Star rating -->
  <div class="t w3 h1" data-k="chart-stars"><div class="stars"></div></div>

  <!-- 36 Love / Wow / Fire pops -->
  <div class="t w1 h1" data-k="react-love"><img class="pop" src="../img/fb/love.webp" alt=""></div>
  <div class="t w1 h1" data-k="react-wow"><img class="pop" src="../img/fb/wow.webp" alt="" style="animation-delay:.5s"></div>
  <div class="t w1 h1" data-k="sticker-fire"><img class="pop" src="../img/fb/fire.webp" alt="" style="animation-delay:1s"></div>

  <!-- 37 Sticker tray (Xcode prototype) -->
  <div class="t w3 h3" data-k="sticker-tray"><div class="gifw"><img src="img/composer-keyboard.gif" alt=""></div></div>

  <!-- 38 3D frame -->
  <div class="t w3 h3" data-k="3d-designs"><img class="art" src="img/frame3d.webp" alt="" style="animation-delay:-4s"></div>

  <!-- 39 Stacked bar chart -->
  <div class="t w3 h2" data-k="chart-stacked">
    <div class="hbar">
      <div><i style="width:46%;background:#0866FF"></i><i style="width:24%;background:#A873FF;animation-delay:.1s"></i><i style="width:14%;background:#2ABBA7;animation-delay:.2s"></i></div>
      <div><i style="width:36%;background:#0866FF;animation-delay:.05s"></i><i style="width:30%;background:#A873FF;animation-delay:.15s"></i><i style="width:20%;background:#2ABBA7;animation-delay:.25s"></i></div>
      <div><i style="width:52%;background:#0866FF;animation-delay:.1s"></i><i style="width:18%;background:#A873FF;animation-delay:.2s"></i><i style="width:10%;background:#2ABBA7;animation-delay:.3s"></i></div>
    </div>
  </div>

  <!-- 40 Badges -->
  <div class="t w1 h1" data-k="badge-verified"><img class="bdg" src="../img/fb/badge-check.webp" alt=""></div>
  <div class="t w1 h1" data-k="badge-chat"><img class="bdg" src="../img/fb/badge-chat.webp" alt="" style="animation-delay:.8s"></div>

  <!-- 41 3D analytics -->
  <div class="t w3 h2" data-k="3d-analytics"><img class="art" src="img/analytics.webp" alt="" style="animation-delay:-1s"></div>

</div></div>
<div class="cursors" id="cursors"></div>
</div>

<script>
(()=>{
const stage=document.getElementById('stage');
function fit(){const k=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`translate(-50%,-50%) scale(${k})`;}
addEventListener('resize',fit);fit();
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const $$=(s,r=document)=>[...r.querySelectorAll(s)];

/* build-once parts */
$$('.stars').forEach(el=>{for(let i=0;i<5;i++){const part=i<4?1:.5;
  el.insertAdjacentHTML('beforeend',`<svg viewBox="0 0 24 24"><defs><clipPath id="sc${i}"><rect class="fillr" x="0" y="0" width="${24*part}" height="24" style="animation-delay:${i*.1}s"/></clipPath></defs><path d="m12 2 3 6.5 7 .8-5.2 4.8 1.4 7L12 17.6 5.8 21l1.4-7L2 9.3l7-.8z" fill="#3A3B3C"/><path clip-path="url(#sc${i})" d="m12 2 3 6.5 7 .8-5.2 4.8 1.4 7L12 17.6 5.8 21l1.4-7L2 9.3l7-.8z" fill="#F7B928"/></svg>`);}});
$$('.ttt .wave').forEach(w=>{for(let i=0;i<16;i++)w.insertAdjacentHTML('beforeend',`<i style="animation-delay:${(i*.07)%.9}s"></i>`)});
$$('.kb .k').forEach((k,i)=>{const n=[10,9,7,0][i];for(let j=0;j<n;j++)k.insertAdjacentHTML('beforeend','<i></i>')});

/* duplicate the set for a seamless horizontal loop */
const track=document.getElementById('track'),set=document.getElementById('set');
const clone=set.cloneNode(true);clone.removeAttribute('id');clone.setAttribute('aria-hidden','true');
clone.querySelectorAll('[id]').forEach(n=>n.removeAttribute('id'));track.appendChild(clone);

/* count up */
const fmt=(n,f,suf)=>(f==='k'?(n>=1000?(n/1000).toFixed(1).replace(/\.0$/,'')+'K':Math.round(n)+''):Math.round(n).toLocaleString())+(suf||'');
function countAll(){$$('[data-count]').forEach(el=>{const to=+el.dataset.count,from=to*(to<200?0:.8),t0=performance.now(),d=1400;
  (function step(t){const p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,3);el.textContent=fmt(from+(to-from)*e,el.dataset.fmt,el.dataset.suf);if(p<1)requestAnimationFrame(step)})(t0);});}
countAll();if(!reduce)setInterval(countAll,6000);

if(!reduce){
/* comment modes */
$$('.cmt').forEach(c=>{const m=['light','dark','live'];let i=0;setInterval(()=>{i=(i+1)%3;c.dataset.m=m[i]},2800)});
/* tab bar: each icon on, then off */
$$('[data-tabs]').forEach(tb=>{const it=$$('span',tb),bar=tb.querySelector('.bar');let i=0;
  const place=()=>{bar.style.transform=`translateX(${it[i].offsetLeft}px)`;it.forEach((s,j)=>s.classList.toggle('on',j===i))};
  requestAnimationFrame(place);setInterval(()=>{i=(i+1)%it.length;place()},1000);});
/* numbered badge counts up */
$$('.bell').forEach(b=>{const nb=b.querySelector('.nb');let n=1;setInterval(()=>{n=n>=10?1:n+1;nb.textContent=n>9?'9+':n;
  nb.classList.add('bump');b.classList.add('ring');setTimeout(()=>{nb.classList.remove('bump');b.classList.remove('ring')},380)},900);});
/* reaction count ticks */
$$('[data-tick]').forEach(el=>{let n=+el.dataset.tick;setInterval(()=>{n+=1+Math.floor(Math.random()*4);if(n>1400)n=1240;el.textContent=n.toLocaleString()},420)});
/* media tile variants */
$$('.mts').forEach(m=>{let v=0;setInterval(()=>{v=(v+1)%4;m.dataset.v=v},1500)});
/* toggles with avatar */
$$('.cell').forEach(c=>{const rows=$$('[data-tg]',c);let i=0;setInterval(()=>{const r=rows[i%rows.length];const s=r.querySelector('.sw');
  const on=!s.classList.contains('on');s.classList.toggle('on',on);r.classList.toggle('lit',on);i++},1100)});
/* nickname identity swap */
$$('.nick').forEach(n=>{const s=n.querySelector('.sw');setInterval(()=>{const k=n.dataset.s==='0'?'1':'0';n.dataset.s=k;s.classList.toggle('on',k==='1')},2200)});
/* talk to text */
$$('.ttt').forEach(card=>{const tm=card.querySelector('.tm');let timer;
  function run(){card.classList.remove('s1','s2');tm.textContent='0:00';clearInterval(timer);
    setTimeout(()=>card.classList.add('s1'),700);
    setTimeout(()=>{card.classList.remove('s1');card.classList.add('s2');let s=0;timer=setInterval(()=>{s++;tm.textContent='0:0'+Math.min(s,9)},500)},1100);
    setTimeout(()=>{clearInterval(timer);card.classList.remove('s2')},5200);}
  run();setInterval(run,6400);});
/* messenger composer: focus, icons collapse, keyboard rises, typing */
$$('.kbw').forEach(w=>{const ty=w.querySelector('.typed'),keys=$$('.kb i',w);const msg='Sunrise hike? 🌄';
  function run(){w.classList.remove('focus');ty.textContent='';
    setTimeout(()=>w.classList.add('focus'),900);
    [...msg].forEach((ch,i)=>setTimeout(()=>{ty.textContent+=ch;const k=keys[Math.floor(Math.random()*26)];k.classList.add('hit');setTimeout(()=>k.classList.remove('hit'),110)},1500+i*140));
    setTimeout(()=>w.classList.remove('focus'),1500+msg.length*140+1500);}
  run();setInterval(run,1500+msg.length*140+2600);});
}

/* horizontal glide */
let x=0,last=performance.now(),W=0;const SPEED=34; // px per second
function measure(){W=set.getBoundingClientRect().width/ (parseFloat(getComputedStyle(stage).transform.split(',')[0].replace('matrix(',''))||1)+16;
  window.__wall={cards:set.children.length,loopPx:Math.round(W),speed:SPEED,lapSec:Math.round(W/SPEED)};}
addEventListener('load',measure);setTimeout(measure,500);
function tick(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(!reduce&&W){x-=SPEED*dt;if(x<=-W)x+=W;track.style.transform=`translate3d(${x}px,0,0)`;}requestAnimationFrame(tick);}
requestAnimationFrame(tick);

/* Figma cursors with names, arriving one by one */
const people=[['Julie','#A259FF',.22,.30],['Adam','#0ACF83',.52,.18],['Eduardo','#FF7262',.80,.46],['Jeremy','#1ABCFE',.34,.72],['Josh','#F5B400',.66,.82]];
const host=document.getElementById('cursors');
const curs=people.map(([n,c])=>{const d=document.createElement('div');d.className='cur';
  d.innerHTML=`<svg viewBox="0 0 24 24"><path d="M3 2l7.5 19 2.6-7.6L21 10.6z" fill="${c}" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg><span style="background:${c};${n==='Josh'?'color:#1a1a1a':''}">${n}</span>`;
  host.appendChild(d);return d;});
const SW=1920,SH=1080;
function place(d,x,y,ms){d.style.transition=`transform ${ms}ms var(--move),opacity .4s`;d.style.transform=`translate(${x}px,${y}px)`;}
function arrive(){curs.forEach((d,i)=>{const p=people[i];d.classList.remove('in');place(d,i%2?SW+60:-60,p[3]*SH+120,0);
  setTimeout(()=>{d.classList.add('in');place(d,p[2]*SW,p[3]*SH,1400);},400+i*700);});}
function drift(){curs.forEach((d,i)=>{if(!d.classList.contains('in'))return;const p=people[i];place(d,p[2]*SW+(Math.random()*180-90),p[3]*SH+(Math.random()*120-60),2400);});}
arrive();if(!reduce){setInterval(drift,2600);setInterval(arrive,30000);}
})();
</script>
</body>
</html>
