<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story Wall · Julie Torrisi-Coffey</title>
<meta name="robots" content="noindex">
<style>
:root{
  --wall:#18191B; --tile:#222326; --tile-line:rgba(255,255,255,.05); --light:#FFFFFF; --blue:#0866FF;
  --u:128px; --g:20px; --r:20px;
  /* motion tokens (proposed, mirror Eduardo's naming): enter, leave, move, spring for people */
  --out-bold:cubic-bezier(.2,.8,.2,1); --in-practical:cubic-bezier(.4,0,1,1); --inout-bold:cubic-bezier(.6,0,.2,1);
  --spring:cubic-bezier(.34,1.56,.64,1); --tray:300ms;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--wall);overflow:hidden}
body{font-family:-apple-system,system-ui,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
img{display:block;user-select:none;-webkit-user-drag:none}
#stage{position:fixed;inset:0;overflow:hidden;background:var(--wall)}
#track{position:absolute;left:0;top:32px;height:1016px;will-change:transform}

/* card frame: appears on the right as an empty box, then its component builds in */
.t{position:absolute;border-radius:var(--r);background:var(--tile);border:1px solid var(--tile-line);overflow:hidden;
  opacity:0;transform:scale(.96);transition:opacity .5s var(--out-bold),transform .5s var(--out-bold)}
.t.light{background:var(--light);border-color:transparent}
.t.blue{background:var(--blue);border-color:transparent}
.t.media{background:#000 center/cover}
.t.media::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.55))}
.t.shown{opacity:1;transform:none}
/* a new card arrives selected: brand-gradient outline that fades once its component has built */
.t::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;opacity:0;
  background:linear-gradient(135deg,#0866FF,#A873FF 40%,#2ABBA7 70%,#F7B928);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;transition:opacity .6s var(--out-bold)}
.t.fresh::after{opacity:1}
.band{position:absolute;overflow:hidden}
.band>img{position:absolute;max-width:none}
.band{opacity:0}
.built .band{animation-fill-mode:both;animation-duration:.7s;animation-timing-function:var(--out-bold)}
.built .band.l{animation-name:bl}.built .band.u{animation-name:bu}.built .band.f{animation-name:bf}
@keyframes bl{from{opacity:1;clip-path:inset(0 100% 0 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}
@keyframes bu{from{opacity:1;clip-path:inset(100% 0 0 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}
@keyframes bf{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.clip{display:block}
.t .c{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transform:translateY(10px);transition:opacity .5s var(--out-bold),transform .5s var(--out-bold)}
.t.built .c{opacity:1;transform:none}

/* a slot holds one component at its native size; frames stack inside it */
.slot{position:relative}
.slot>img{position:absolute;left:0;top:0;opacity:0;transition:opacity .4s var(--out-bold)}
.slot>img.on{opacity:1}
.slot.stack>img{transform:translateY(16px);transition:opacity .45s var(--out-bold),transform .45s var(--out-bold)}
.slot.stack>img.on{transform:none}
.slot.reveal>img{opacity:1;clip-path:inset(0 100% 0 0)}
.slot.reveal.up>img{clip-path:inset(100% 0 0 0)}
.slot.reveal.down>img{clip-path:inset(0 0 100% 0)}
.built .slot.reveal>img{transition:clip-path 1.1s var(--out-bold);clip-path:inset(0 0 0 0)}
.slot.tray{overflow:hidden}
.slot.tray>img{opacity:1;transform:translateY(105%);transition:transform var(--tray) var(--out-bold)}
.slot.tray>img.on{transform:none}
.slot.tray>img.off{transform:translateY(105%);transition:transform 250ms var(--in-practical)}
.slot.toast>img{opacity:0;transform:translateY(30px);transition:opacity .35s var(--out-bold),transform .35s var(--out-bold)}
.slot.toast>img.on{opacity:1;transform:none}
.slot.toast>img.off{opacity:0;transform:translateY(-20px);transition:opacity .3s var(--in-practical),transform .3s var(--in-practical)}
.slot.spin>img.on.r0{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.row{display:flex;align-items:center;gap:16px}
.row>img{transform:scale(0);transition:transform .45s var(--spring)}
.row>img.on{transform:scale(1)}

/* brand assets */

.app{width:52px;height:52px;border-radius:12px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))}
.bvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fb{width:96px;height:96px}

/* cursors */
#cursors{position:absolute;inset:0;pointer-events:none;z-index:20}
.cur{position:absolute;left:0;top:0;opacity:0;transition:opacity .3s}
.cur svg{width:24px;height:24px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.cur span{position:absolute;left:16px;top:20px;white-space:nowrap;font:600 14px/1 -apple-system,system-ui,sans-serif;color:#fff;padding:6px 9px;border-radius:4px 11px 11px 11px;
  transform:scale(0);transform-origin:0 0;transition:transform .4s var(--spring)}
.cur.in{opacity:1}.cur.named span{transform:scale(1)}
.cur i{position:absolute;left:-10px;top:-10px;width:24px;height:24px;border-radius:50%;border:2px solid currentColor;opacity:0}
.cur i.go{animation:clk .5s var(--out-bold)}
@keyframes clk{from{transform:scale(.3);opacity:1}to{transform:scale(1.5);opacity:0}}
.cur.press svg{transform:scale(.86);transition:transform .12s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* STORY WALL RULES (Julie, 2026-11-04). Every edit she asks for becomes a rule here and in the skill.
 1  Only real pieces: Blueprint library components exported as-is, her own prototype captures, official Facebook brand assets. Never invent a pattern.
 2  Nothing scales. Components render at their native pixel size; the page never zooms to fit the window.
 3  Components only. No screens, no phone frames, no captions, no metric cards, no presentation-deck visuals (no 3D silver art, no flower).
 4  Never the same asset twice on screen. Brand video appears as different micro clips, each used once.
 5  Motion matches Eduardo Sonnino's Story Factory wall: right to left, 0.06 screen heights a second (64.8 px/s at 1080), 7 rows.
 6  The wall starts populated. New boxes appear on the right as they arrive, empty and outlined, then their component builds in.
 7  Data builds in reading order: header first, then rows or columns wipe in one after another.
 8  Enter on out.bold, leave on in.practical, move on inout.bold, spring only for people (cursors) and reactions.
 9  Figma cursors (Julie, Adam, Eduardo, Jeremy, Josh) come in from the nearest edge, press real controls (mic, switch, tabs, field), and leave the way they came.
 10 Micro moments stay short (under 6 s a loop) so the eye can wander.
*/

const META={"cmt-1":[375,137],"cmt-2":[375,137],"cmt-3":[375,137],"cmtm-att":[375,237],"cmtm-reply":[375,130],"cmtc-ok":[375,130],"cmtc-err":[375,105],"thr-c":[375,137],"thr-e":[375,657],"abar":[375,24],"fp-1":[375,40],"fp-2":[375,40],"fp-3":[375,40],"sb-1":[55,16],"sb-2":[72,16],"sb-3":[55,16],"csb-1":[58,16],"csb-2":[58,16],"csb-3":[56,16],"ssb-1":[56,16],"ssb-2":[65,16],"ssb-3":[62,16],"ex-100":[100,100],"ex-60":[60,60],"ex-40":[40,40],"ex-32":[32,32],"ex-24":[24,24],"ex-20":[20,20],"ex-16":[16,16],"note-bl":[175,81],"note-br":[175,81],"note-tl":[175,81],"note-tr":[175,81],"chat-o":[375,75],"chat-y":[375,75],"bling-d":[375,36],"bling-p":[375,36],"ring-i":[32,32],"ring-d":[32,32],"pbar":[375,20],"ctx-4":[375,150],"ntf-u":[375,96],"ntf-r":[375,96],"pbc-1":[375,35],"pbc-2":[375,58],"pbc-3":[375,81],"pbc-4":[375,104],"pbc-5":[375,127],"pbs-5":[375,127],"donut-h":[375,91],"bar-v":[375,248],"bar-h":[375,210],"cmp-d":[375,60],"cmp-a":[375,56],"cmp-t":[375,56],"cmpl-d":[375,64],"cmpl-a":[375,56],"cmpl-t":[375,56],"card-e":[375,120],"card-d":[375,120],"sw-off":[51,31],"sw-on":[51,31],"chip-d":[86,36],"chip-s":[112,36],"chipm-d":[86,36],"chipm-s":[112,36],"tray-st":[402,436],"tray-cr":[402,336],"star-0":[177,55],"star-1":[177,55],"star-2":[177,55],"star-3":[177,55],"star-4":[177,55],"star-5":[177,55],"star-6":[177,55],"star-7":[177,55],"star-8":[177,55],"star-9":[177,55],"rate-0":[375,110],"rate-1":[375,110],"rate-2":[375,110],"rate-3":[375,110],"rate-4":[375,110],"rate-5":[375,110],"tab-1":[375,76],"tab-2":[375,76],"tab-3":[375,76],"tab-4":[375,76],"tab-5":[375,76],"dots-1":[62,24],"dots-2":[62,24],"dots-3":[62,24],"dots-4":[62,24],"dots-5":[62,24],"ufi-only":[43,20],"ufi-count":[43,20],"ufi-liked":[43,20],"ufi-love":[43,20],"ufi-care":[43,20],"ufi-haha":[43,20],"ufi-wow":[43,20],"ufi-sad":[43,20],"ufi-angry":[43,20]};

/* ---------- dense packer, endless ---------- */
const occ=[];const cell=(c,r)=>occ[c]&&occ[c][r];let firstOpen=0,poolIx=0;const items=[];

  for(let i=c;i<c+spec.w;i++){occ[i]=occ[i]||[];for(let j=r;j<r+spec.h;j++)occ[i][j]=1}
  while(occ[firstOpen]&&occ[firstOpen].filter(Boolean).length===ROWS)firstOpen++;

    s.bands.forEach(([bx,by,bw,bh,d],i)=>{const b=document.createElement('div');b.className='band '+d;b.style.cssText=`left:${bx}px;top:${by}px;width:${bw}px;height:${bh}px;animation-delay:${(i*0.16).toFixed(2)}s`;
      const im=img(s.f);im.style.left=-bx+'px';im.style.top=-by+'px';b.appendChild(im);slot.appendChild(b)});c.appendChild(slot);}
  else{slot=document.createElement('div');slot.className='slot '+s.type+(s.spin?' spin':'');
    const ws=s.f.map(n=>META[n][0]),hs=s.f.map(n=>META[n][1]);slot.style.width=Math.max(...ws)+'px';
    slot.style.height=(s.type==='stack'?hs.reduce((a,b)=>a+b,0)+(s.gap||0)*(hs.length-1):Math.max(...hs))+'px';
    let y=0;s.f.forEach((n,i)=>{const im=img(n);if(s.type==='stack'){im.style.top=y+'px';y+=META[n][1]+(s.gap||0)}if(s.spin&&i===0)im.classList.add('r0');slot.appendChild(im)});
    c.appendChild(slot);if(s.align==='top'){c.style.placeItems='start center';c.style.paddingTop=Math.max(20,((it.h-Math.max(...hs))/2)|0)+'px'}}
  it.el=t;it.slot=slot;it.timers=[];track.appendChild(t);}

/* ---------- card programs ---------- */
function run(it){const s=it.spec,sl=it.slot;if(reduce){if(sl)[...sl.children].forEach(x=>x.classList.add('on'));return}
  const kids=sl?[...sl.children]:[];
  if(s.type==='cycle'){it.i=0;kids[0].classList.add('on');
    it.next=()=>{clearTimeout(it.cy);kids[it.i].classList.remove('on');it.i=(it.i+1)%kids.length;kids[it.i].classList.add('on');
      const wait=(s.hold&&it.i===kids.length-1)?s.ms*6:s.ms;it.cy=setTimeout(it.next,wait);it.timers.push(it.cy)};
    it.cy=setTimeout(it.next,s.ms);it.timers.push(it.cy);}
  else if(s.type==='stack'||s.type==='row'){const go=()=>{kids.forEach(k=>k.classList.remove('on'));kids.forEach((k,i)=>later(it,200+i*s.ms,()=>k.classList.add('on')));later(it,200+kids.length*s.ms+(s.type==='row'?3200:2600),go)};go();}
  else if(s.type==='tray'){const k=kids[0];const go=()=>{k.classList.remove('off');k.classList.add('on');later(it,s.ms,()=>{k.classList.remove('on');k.classList.add('off')});later(it,s.ms+900,go)};later(it,250,go);}
  else if(s.type==='toast'){const k=kids[0];const go=()=>{k.classList.remove('off');k.classList.add('on');later(it,s.ms,()=>{k.classList.remove('on');k.classList.add('off')});later(it,s.ms+1100,()=>{k.classList.remove('off');go()})};later(it,300,go);}
  else if(s.type==='bands'&&s.loop){const go=()=>{it.el.classList.remove('built');void it.el.offsetWidth;it.el.classList.add('built');later(it,s.loop,go)};later(it,s.loop,go);}
  else if(s.type==='video'||s.type==='clip'){const v=it.el.querySelector('video');v.currentTime=0;v.play().catch(()=>{});it.video=v;}
  if(s.pop){const im=it.el.querySelector('img');im.animate([{transform:'scale(.2)'},{transform:'scale(1.15)',offset:.6},{transform:'scale(1)'}],{duration:600,easing:'cubic-bezier(.34,1.56,.64,1)'});}}
function stop(it){it.timers.forEach(clearTimeout);it.timers=[];if(it.video)it.video.pause();}

/* ---------- glide: right to left at Eduardo's speed (0.06 screen heights a second) ---------- */
const SPEED=64.8;let x=0,last=performance.now(),head=0;const live=[];
function show(it,fresh){make(it);it.state=1;requestAnimationFrame(()=>{it.el.classList.add('shown');if(fresh)it.el.classList.add('fresh')});
  later(it,fresh?rnd(500,900):rnd(0,500),()=>{it.el.classList.add('built');it.state=2;run(it);if(fresh)later(it,900,()=>it.el.classList.remove('fresh'))});}
// start populated: everything already on screen is there from the first frame
ensure(VW+600);while(head<items.length&&items[head].x<VW){const it=items[head++];live.push(it);show(it,false);}
function frame(t){const dt=Math.min(.25,(t-last)/1000);last=t;if(!reduce)x-=SPEED*dt;
  track.style.transform=`translate3d(${x.toFixed(2)}px,0,0)`;
  const right=-x+VW;ensure(right+600);
  while(head<items.length&&items[head].x<right+40){const it=items[head++];it.appearAt=rnd(30,200);it.state=0;live.push(it);}
  for(let i=live.length-1;i>=0;i--){const it=live[i];const sx=it.x+x;
    if(it.state===0&&sx<VW-it.appearAt)show(it,true);
    if(sx+it.w<-40){stop(it);it.el&&it.el.remove();live.splice(i,1);}}
  moveCursors(dt);requestAnimationFrame(frame);}
requestAnimationFrame(frame);

/* ---------- Figma cursors: in from the nearest edge, press a real control, out the same way ---------- */
const people=[['Julie','#A259FF'],['Adam','#0ACF83'],['Eduardo','#FF7262'],['Jeremy','#1ABCFE'],['Josh','#F5B400']];
const host=document.getElementById('cursors');
const curs=people.map(([n,c])=>{const d=document.createElement('div');d.className='cur';d.style.color=c;
  d.innerHTML=`<i></i><svg viewBox="0 0 24 24"><path d="M3 2l7.5 19 2.6-7.6L21 10.6z" fill="${c}" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg><span style="background:${c};${n==='Josh'?'color:#1a1a1a':''}">${n}</span>`;
  host.appendChild(d);return {d,busy:false,x:0,y:0,follow:false};});
let who=0;
function moveCursors(dt){curs.forEach(k=>{if(k.follow){k.x-=SPEED*dt;k.d.style.transform=`translate(${k.x}px,${k.y}px)`}})}
function glide(k,tx,ty,ms,e){return new Promise(res=>{const x0=k.x,y0=k.y,t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/ms),q=e(p);k.x=x0+(tx-x0)*q;k.y=y0+(ty-y0)*q;k.d.style.transform=`translate(${k.x}px,${k.y}px)`;p<1?requestAnimationFrame(f):res()})(t0)})}
const eOut=p=>1-Math.pow(1-p,3),eIn=p=>p*p*p,wait=ms=>new Promise(r=>setTimeout(r,ms));
function click(k){const r=k.d.querySelector('i');r.classList.remove('go');void r.offsetWidth;r.classList.add('go');k.d.classList.add('press');setTimeout(()=>k.d.classList.remove('press'),140)}
function hotPoint(it,hx,hy){const sr=it.slot.getBoundingClientRect();return [sr.left+hx,sr.top+hy]}
async function visit(){if(curs.filter(k=>k.busy).length>=2)return;const k=curs[who%curs.length];if(k.busy)return;
  const vis=live.filter(it=>it.state===2&&it.x+x>220&&it.x+x+it.w<VW-260&&!it.claimed);if(!vis.length)return;
  const inter=vis.filter(it=>it.spec.hot||it.spec.hotTabs);const it=(inter.length&&Math.random()<.85?inter:vis)[Math.floor(Math.random()*(inter.length?inter.length:vis.length))]||vis[0];
  who++;k.busy=true;it.claimed=true;const s=it.spec;
  let tx,ty;if(s.hotTabs){const nx=((it.i||0)+1)%s.hotTabs;[tx,ty]=hotPoint(it,375*(nx+.5)/s.hotTabs,32)}else if(s.hot){[tx,ty]=hotPoint(it,s.hot[0],s.hot[1])}else{const r=it.el.getBoundingClientRect();tx=r.left+r.width*rnd(.35,.65);ty=r.top+r.height*rnd(.35,.65)}
  let lead=0;if(s.type==='clip'&&it.video){const d=it.video.duration||5;lead=((s.hotT-it.video.currentTime)%d+d)%d;if(lead<1.3)lead+=d;}
  const travel=1000,arrive=Math.max(0,lead*1000-travel-250);await wait(arrive);
  const m=Math.min(tx,VW-tx,ty,VH-ty);const edge=m===ty?'t':m===VH-ty?'b':m===tx?'l':'r';
  const ex=edge==='l'?-40:edge==='r'?VW+40:tx,ey=edge==='t'?-40:edge==='b'?VH+40:ty;
  const drift=SPEED*((arrive+travel)/1000);tx-=SPEED*(travel/1000);
  k.x=ex;k.y=ey;k.d.classList.add('in');await glide(k,tx,ty,travel,eOut);k.d.classList.add('named');k.follow=true;
  await wait(250);if(s.hot||s.hotTabs){click(k);if(it.next)it.next();}
  await wait(rnd(1400,2200));k.follow=false;k.d.classList.remove('named');
  const bx=edge==='l'?-50:edge==='r'?VW+50:k.x,by=edge==='t'?-50:edge==='b'?VH+50:k.y;
  await glide(k,bx,by,850,eIn);k.d.classList.remove('in');k.busy=false;it.claimed=false;}
if(!reduce){setTimeout(visit,1500);setInterval(visit,2600);}
window.__wall={speed:SPEED,pool:POOL.length};
})();
</script>
