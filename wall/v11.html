<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Story Wall v11 · Julie Torrisi-Coffey</title>
<style>
/* Story Wall v10 (dark). Rules: Story-Wall_rules.md (merged 11/9).
   7 rows · 128 px units · 20 px gaps (9b). Every tile is whole units; the component sits on its card
   with the same 24 px on all four sides (clips: their own equal pad). One component set per screen (4a).
   Entry (10): shell → glow once → build in pieces → hold or one slow loop. */
:root{
  --wall:#1F1E21;--tile:#24232A;--card:#252728;           /* measured from Eduardo's video (rule 9) */
  --blue:#3C88FF;--lilac:#A873FF;--mist:#B0B0C2;           /* Cadence kit (deck) */
  --ck-glow-warm:#FFB224;                                   /* SYSTEM GAP: proposed warm stop, not in the kit yet */
  --ck-motion-duration-cinematic:800ms;--ck-motion-duration-standard:300ms;
  --out-bold:cubic-bezier(.2,.8,.2,1);--in-practical:cubic-bezier(.4,0,1,1);--inout-bold:cubic-bezier(.6,0,.2,1);
  --spring:cubic-bezier(.34,1.56,.64,1)}
@property --ga{syntax:'<angle>';inherits:false;initial-value:0deg}
html,body{margin:0;height:100%;background:var(--wall);overflow:hidden}
#stage{position:fixed;inset:0}
#track{position:absolute;left:0;top:0;will-change:transform}
.col{position:absolute;left:0;top:0}
.t{position:absolute;border-radius:22px;background:var(--tile);box-shadow:0 10px 30px rgba(0,0,0,.22)}
/* glow: thin gradient on two or three sides with gaps, one light source; in 150 · hold 450 · out 650, drifts 40°, never loops */
.t::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;opacity:0;
  background:conic-gradient(from var(--ga),transparent 0deg 18deg,var(--blue) 48deg,var(--lilac) 92deg,var(--mist) 128deg,var(--ck-glow-warm) 160deg,transparent 196deg 232deg,var(--blue) 262deg,var(--lilac) 300deg,transparent 334deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.t.glow::after{animation:glow 1250ms linear forwards}
@keyframes glow{0%{opacity:0;--ga:0deg;animation-timing-function:var(--out-bold)}12%{opacity:1}48%{opacity:1;animation-timing-function:var(--in-practical)}100%{opacity:0;--ga:40deg}}
.in{position:absolute;display:grid;place-items:center;border-radius:14px;opacity:0;clip-path:inset(0 0 100% 0 round 14px);
  transition:opacity .4s var(--out-bold),clip-path .7s var(--out-bold)}
.in.card{background:var(--card);box-shadow:0 8px 22px rgba(0,0,0,.35)}
.t.built .in{opacity:1;clip-path:inset(0 0 0 0 round 14px)}
.in.bare{clip-path:none;border-radius:0}.t.built .in.bare{clip-path:none}
.c{position:relative;display:block}
.c img,.c video{display:block}
.shadow{border-radius:14px;box-shadow:0 8px 22px rgba(0,0,0,.35);overflow:hidden}
/* rows wipe in, 180 ms apart (10.3) */
.stack>*{opacity:0;clip-path:inset(0 100% 0 0);transition:opacity .35s var(--out-bold),clip-path .5s var(--out-bold)}
.stack>.on{opacity:1;clip-path:inset(0 0 0 0)}
.swap{position:relative}.swap>*{transition:opacity .35s var(--out-bold)}.swap>.alt{position:absolute;inset:0;opacity:0}
.swap.b>.alt{opacity:1}.swap.b>.base{opacity:0}
/* icons pop in, scaling up (J7) */
.pop{opacity:0;transform:scale(.55);transition:opacity .3s var(--out-bold),transform .45s var(--out-bold)}
.pop.on{opacity:1;transform:none}
.wm{background:#fff;border-radius:14px;display:grid;place-items:center}
/* bento in a bento */
.mo{display:grid;grid-template-columns:110px 110px 1fr;grid-template-rows:1fr 1fr;gap:8px;width:376px;height:228px}
.mo>div{border-radius:12px;overflow:hidden;display:grid;place-items:center;position:relative}
.m1{background:#0A0A0A;grid-row:1;grid-column:1}.m2{background:#0866FF;grid-row:1;grid-column:2}
.m3{background:#F0F2F5;grid-row:1/3;grid-column:3}
.m4{grid-column:1/3;grid-row:2;background:#0866FF;background-image:radial-gradient(rgba(255,255,255,.35) 1.4px,transparent 1.6px);background-size:16px 16px}
.mo .p{opacity:0;transform:scale(.6);transition:opacity .3s var(--out-bold),transform .45s var(--out-bold)}.mo .p.on{opacity:1;transform:none}
/* count-ups: covers sit over the exported digits while the live number counts, then lift to show the real pixels */
.cv{position:absolute;background:var(--card);font-variant-numeric:tabular-nums;white-space:nowrap;
  font-family:-apple-system,"SF Pro Text","SF Pro",system-ui,sans-serif}
.rv{position:absolute;inset:0}
.typecover{position:absolute;background:#3B3D3E}
.wave{position:absolute;left:109px;top:36px;width:226px;height:23px;background:#0C5CFF;opacity:0;transition:opacity .15s}
.wave.on{opacity:1}.wave>img{position:absolute;left:0;top:0;opacity:0;transition:opacity .09s linear}.wave>img.on{opacity:1}
.rpop{position:absolute;pointer-events:none;width:44px;height:44px;opacity:0}
.rpop.go{animation:rpop 1.1s var(--spring) forwards}
@keyframes rpop{0%{opacity:0;transform:translate(-50%,0) scale(.3)}25%{opacity:1;transform:translate(-50%,-26px) scale(1.15)}70%{opacity:1;transform:translate(-50%,-34px) scale(1)}100%{opacity:0;transform:translate(-50%,-44px) scale(.9)}}
.press{transition:transform .14s}.press.down{transform:scale(.94)}
.cur{position:fixed;left:0;top:0;z-index:50;pointer-events:none;will-change:transform}
.cur svg{width:34px;height:34px;display:block;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4));transition:transform .14s}
.cur.press svg{transform:scale(.82)}
.cur b{position:absolute;left:26px;top:28px;font:600 22px/1 -apple-system,"SF Pro",system-ui,sans-serif;color:#fff;padding:8px 14px;border-radius:999px;white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.cur i{position:absolute;left:-14px;top:-14px;width:28px;height:28px;border-radius:50%;border:3px solid var(--cc);opacity:0}
.cur i.go{animation:ring .5s var(--out-bold)}@keyframes ring{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(1.8)}}
/* Blueprint glimmer: pulses until the real component resolves */
.gl{animation:glp 1.1s cubic-bezier(.45,0,.55,1) infinite alternate}@keyframes glp{from{opacity:1}to{opacity:.5}}
/* chart tiles: one tile per chart component, its styles take turns in place (4a) */
.cst{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);opacity:0;transition:opacity .15s cubic-bezier(.45,.1,.2,1)}
.cst.on{opacity:1;transition:opacity .28s cubic-bezier(.14,1,.34,1) .15s}
.ov{position:absolute;inset:0}
.sw8{position:absolute}
/* Blueprint pressed state (Pressed State page): overlay "Non Media Pressed on Dark" white 30%; FDSButton scale .97, 100 ms in */
.bpress{position:absolute;border-radius:8px;transition:transform .1s cubic-bezier(.14,1,.34,1)}
.bpress::after{content:"";position:absolute;inset:0;border-radius:8px;background:rgba(255,255,255,.3);opacity:0;transition:opacity .1s cubic-bezier(.14,1,.34,1)}
.bpress.down{transform:scale(.97)}.bpress.down::after{opacity:1}
/* reaction picker: Julie's prototype spec (FDSReactionBar.swift) in dark mode */
.rx{position:relative;width:334px;height:200px}
.ufiw{position:absolute;left:0;bottom:0;width:186px;height:44px}
.ufiw img{position:absolute;left:0;top:0;transition:opacity .28s cubic-bezier(.14,1,.34,1)}
.ufiw .haha{opacity:0}.rx.sel .ufiw .haha{opacity:1}.rx.sel .ufiw .def{opacity:0}
.uprs{position:absolute;left:2.5px;top:4px;width:76px;height:36px;border-radius:8px;background:rgba(255,255,255,.3);opacity:0;transition:opacity .1s cubic-bezier(.14,1,.34,1)}
.rx.pr .uprs{opacity:1}
.dock{position:absolute;left:2.5px;bottom:48px;display:flex;align-items:flex-end;gap:6px;padding:6px;height:40px;background:#333334;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05),0 2px 8px rgba(0,0,0,.1);border-radius:999px;
  transform-origin:24px 100%;opacity:0;transform:scale(.8);transition:opacity .2s cubic-bezier(.14,1,.34,1),transform .2s cubic-bezier(.14,1,.34,1),height .28s cubic-bezier(.14,1,.34,1)}
.rx.open .dock{opacity:1;transform:none}
.rx.closing .dock{transition:opacity .15s cubic-bezier(.45,.1,.2,1),transform .15s cubic-bezier(.45,.1,.2,1)}
.rx.hi .dock{height:34px}
.ri{position:relative;width:40px;height:40px;flex:none;transition:width .28s cubic-bezier(.14,1,.34,1),height .28s cubic-bezier(.14,1,.34,1)}
.ri img{position:absolute;left:50%;bottom:0;width:100%;height:auto;transform:translateX(-50%);transition:width .28s cubic-bezier(.14,1,.34,1),bottom .28s cubic-bezier(.14,1,.34,1)}
.ri b{position:absolute;left:50%;bottom:126px;transform:translateX(-50%) scale(.6);opacity:0;white-space:nowrap;padding:6px 8px;border-radius:999px;background:rgba(0,0,0,.8);color:#fff;font:600 13px/1 -apple-system,"SF Pro Text","SF Pro",system-ui,sans-serif;transition:opacity .28s cubic-bezier(.14,1,.34,1),transform .28s cubic-bezier(.14,1,.34,1)}
.rx.hi .ri{width:34px;height:34px}
.rx.hi .ri.h{width:80px;height:34px}
.ri.h img{width:80px!important;bottom:40px}
.ri.h b{opacity:1;transform:translateX(-50%) scale(1)}
@media (prefers-reduced-motion:reduce){.t.glow::after{animation:none}}
</style></head><body><div id="stage"><div id="track"></div></div>
<script>
const SPEED_H=0.06,U=128,G=20,ROWS=7,PAD=24;
const V='v9/',V10='v10/',V11='v11/',BP='bp/',FB='../img/fb/';
const px=n=>n*U+(n-1)*G;                       /* units → px: 1=128 2=276 3=424 4=572 6=868 7=1016 */
const img=(s,w,h,cls='',st='')=>`<img class="${cls}" src="${s}" width="${w}" height="${h}" style="${st}" alt="">`;
const vid=(s,w,h,extra='')=>`<div style="position:relative;width:${w}px;height:${h}px;overflow:hidden;border-radius:14px" class="vbox"><video src="${s}" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);object-fit:none" muted playsinline loop preload="auto"></video>${extra}</div>`;


/* Chart styles from the Blueprint Data page, dark mode. Each state: export, its empty twin (data marks hidden), how the marks build, and the numbers that count. */
const NL=(s,x,y,w,h,fs,c,al='left',fw=400)=>({s,x,y,w,h,fs,c,al,fw});
const HI='242,244,247',LO='176,179,184';
const CH={
 bars:[
  {img:V+'bar-v.png',e:V10+'bar-v-empty.png',w:375,h:248,rv:[[36,84],[105,154],[175,224],[245,293],[315,363]].map(([a,b])=>({t:'up',x0:a,x1:b+1,y0:92,y1:215})),
   n:[NL('56%',28,50,22,9,13,HI,'left',600),NL('26%',141,50,22,9,13,HI,'left',600),NL('18%',236,50,22,9,13,HI,'left',600)]},
  {img:V11+'bar-h.png',e:V11+'bar-h-e.png',w:375,h:210,rv:[107,149,191].map(y=>({t:'lr',x0:12,x1:276,y0:y,y1:y+11})),
   n:[NL('48%',26,51,27,8,12,HI),NL('33%',129,51,27,8,12,HI),NL('19%',235,51,25,8,12,HI),NL('12,480',291,107,48,11,15,HI,'right'),NL('10,215',292,149,45,11,15,HI,'right'),NL('8,532',291,191,40,11,15,HI,'right')]}],
 pbc:[
  {img:V+'pbs-5.png',e:V10+'pbs-5-empty.png',w:375,h:139,rv:[17,40,63,86,109].map(y=>({t:'lr',x0:74,x1:322,y0:y,y1:y+13})),
   n:[[18,'151'],[41,'49'],[64,'22'],[87,'9'],[110,'5']].map(([y,v])=>NL(v,334,y,26,11,15,LO,'right'))},
  {img:V11+'pbc-primary.png',e:V11+'pbc-primary-e.png',w:375,h:127,rv:[13,36,59,82,105].map(y=>({t:'lr',x0:77,x1:310,y0:y,y1:y+9})),
   n:[[12,'1,284'],[35,'742'],[58,'391'],[81,'126'],[104,'48']].map(([y,v])=>NL(v,318,y,44,12,15,LO,'right'))}],
 line:['a','b','c'].map(k=>({img:V11+'line-'+k+'.png',e:V11+'line-'+k+'-e.png',w:375,h:192,rv:[{t:'lr',x0:34,x1:366,y0:60,y1:152}],n:[]})),
 donutc:[
  {img:V11+'donut-a.png',e:V11+'donut-a-e.png',w:375,h:189,rv:[{t:'sweep',x0:147,y0:85,x1:228,y1:166}],
   n:[NL('39%',102.5,103,33,11,15,HI,'right'),NL('2,697',102.5,122,33,8,12,LO,'right'),NL('61%',239.5,103,30,11,15,HI),NL('4,218',239.5,122,32,8,12,LO)]},
  {img:V11+'donut-b.png',e:V11+'donut-b-e.png',w:375,h:245,rv:[{t:'sweep',x0:147,y0:85,x1:228,y1:166}],
   n:[NL('52%',77,177,32,11,15,HI),NL('3,604',77,196,34,8,12,LO),NL('31%',154,177,30,11,15,HI),NL('2,149',154,196,32,8,12,LO),NL('17%',243,177,29,11,15,HI),NL('1,178',243,196,29,8,12,LO)]}],
};
const chartHTML=k=>{const S=CH[k],W=Math.max(...S.map(s=>s.w)),H=Math.max(...S.map(s=>s.h));
 return `<div class="chart" data-ch="${k}" style="position:relative;width:${W}px;height:${H}px">${S.map((s,i)=>`<div class="cst" data-i="${i}" style="width:${s.w}px;height:${s.h}px">${img(s.e,s.w,s.h)}
  ${s.rv.map((r,j)=>r.t==='sweep'?`<div class="ov sw8" data-j="${j}" style="left:${r.x0}px;top:${r.y0}px;width:${r.x1-r.x0}px;height:${r.y1-r.y0}px;background:url(${s.img}) -${r.x0}px -${r.y0}px no-repeat"></div>`:`<div class="ov" data-j="${j}" style="background:url(${s.img}) no-repeat"></div>`).join('')}
  ${s.n.map(n=>`<div class="cv" data-count="${n.s}" style="left:${n.x-2}px;top:${n.y-3}px;width:${n.w+4}px;height:${n.h+6}px;text-align:${n.al};font:${n.fw} ${n.fs}px/${n.h+6}px -apple-system,'SF Pro Text',system-ui,sans-serif;color:rgb(${n.c})">${n.s}</div>`).join('')}</div>`).join('')}</div>`};
const RX=['like','love','support','haha','wow','sad','angry'],RXT=['Like','Love','Care','Haha','Wow','Sad','Angry'];

/* Content. key: {h: html, w,h: units, set: Blueprint component set (4a), b: build type, pad: inner pad, bg: card|white|none, fam: never on screen with same fam} */
const C={
 thread:{u:[3,4],set:'Comment',b:'stack',bg:'card',h:`<div class="stack" style="position:relative;width:375px">${[1,2,3,4].map(i=>img(V+'r'+i+'.png',375,[82,254,102,82][i-1])).join('')}
   <svg class="tl" width="60" height="110" style="position:absolute;left:0;top:0;pointer-events:none;opacity:0;transition:opacity .35s var(--out-bold)"><path d="M31.25 44 V83 Q31.25 94 42.25 94 H56" fill="none" stroke="#3E4042" stroke-width="1.5"/></svg></div>`},
 bars:{u:[3,3],set:'Bar chart (vertical, horizontal)',b:'chart',bg:'card',h:chartHTML('bars')},
 pbc:{u:[3,2],set:'Progress Bar Chart (star rating, primary)',b:'chart',bg:'card',h:chartHTML('pbc')},
 line:{u:[3,2],set:'Line chart (high up, medium down, low up)',b:'chart',bg:'card',h:chartHTML('line')},
 donutc:{u:[3,3],set:'Donut Chart (2 points side, 3 points bottom)',b:'chart',bg:'card',h:chartHTML('donutc')},
 ufi:{u:[3,2],set:'Responsive post footer (UFI) + reaction picker',b:'ufi',bg:'card',h:`<div class="rx"><div class="dock">${RX.map((r,i)=>`<div class="ri" data-r="${i}"><b>${RXT[i]}</b>${img(V11+'rx/'+r+'.png',40,40)}</div>`).join('')}</div>
   <div class="ufiw">${img(V11+'ufi.png',186,44,'def')}${img(V11+'ufi-haha.png',186,44,'haha')}<div class="uprs"></div></div></div>`},
 bling:{u:[3,1],set:'Bling Bar',bg:'card',h:img(V+'bling-d.png',375,36)},
 pill:{u:[3,1],set:'Tab bar (pill)',bg:'none',h:`<div class="swap" data-act="pill" style="border-radius:999px">${img(V+'pill-home.png',376,60,'base')}${img(V+'pill-market.png',376,60,'alt')}</div>`},
 chat:{u:[3,2],set:'Chat Bubble',b:'stack',bg:'card',h:`<div class="stack" style="display:flex;flex-direction:column;gap:8px;width:375px">${img(V+'chat-o.png',375,35)}${img(V+'chat-y.png',375,55)}</div>`},
 cmp:{u:[3,1],set:'Composer',b:'type',bg:'card',h:`<div style="position:relative;width:375px;height:56px">${img(V+'cmp.png',375,56)}<div class="typecover" style="left:22px;top:14px;width:216px;height:28px"></div></div>`},
 ntf:{u:[3,2],set:'Notification Cell',b:'stack',bg:'card',h:`<div class="stack">${img(V+'ntf.png',375,96)}</div>`},
 fp:{u:[3,1],set:'Facepile (+ Context row glimmer)',b:'glimfp',bg:'card',h:`<div class="swap glimfp" style="width:375px;height:36px"><div class="base">${img(V11+'glim-ctxrow.png',375,36,'gl')}</div><div class="alt">${img(V+'fp.png',377,36,'','margin:0 -1px')}</div></div>`},
 glim:{u:[3,2],set:'Contextual Message (+ its Glimmer)',b:'glim',bg:'none',h:`<div class="swap glim" style="width:383px;height:165px;margin:0 -4px" data-act="ctx"><div class="base" style="display:grid;place-items:center;height:165px">${img(V+'glim-ctx.png',375,102,'shadow gl')}</div><div class="alt">${img(V+'ctx.png',383,165)}<div class="bpress" style="left:28px;top:99px;width:327px;height:36px;background:url(${V}ctx.png) -28px -99px"></div></div></div>`},
 star:{u:[2,1],set:'Star Rating Display',bg:'card',h:img(V+'star.png',177,59)},
 wm:{u:[3,2],set:'brand: wordmark',bg:'white',fam:'fbmark',h:img(BP+'fb-wordmark.png',240,43)},
 mosaic:{u:[3,2],set:'brand: bento in a bento',b:'mosaic',bg:'none',h:`<div class="mo"><div class="m1">${img(FB+'care-still.webp',56,56,'p')}</div><div class="m2">${img(FB+'badge-chat.webp',64,64,'p')}</div><div class="m3">${img(FB+'like-still.webp',96,96,'p')}</div><div class="m4">${img(FB+'rock-on-still.webp',100,100,'p')}</div></div>`},
 voice:{u:[4,1],set:'Messenger composer · talk to text (Julie prototype)',fam:'msgr',b:'voice',bg:'white',h:vid('clips/voice3.mp4',444,72,`<div class="wave">${['quiet','speech','loud'].map(n=>img(BP+'wbar-'+n+'.png',226,23)).join('')}</div>`)},
 keys:{u:[4,6],set:'Messenger composer · keyboard + menu (north star)',fam:'msgr',bg:'none',pad:64,h:vid('clips/keys-ns.mp4',444,740)},
 b1:{u:[3,3],set:'brand clip',bg:'none',h:vid('clips/brand-1.mp4',376,376)},
 b2:{u:[4,2],set:'brand clip',bg:'none',h:vid('clips/brand-2.mp4',524,228)},
 b3:{u:[2,2],set:'brand clip',bg:'none',h:vid('clips/brand-3c.mp4',228,228)},
 taper:{u:[2,2],set:'brand refresh tile',bg:'none',pad:43,h:vid('clips/br-taper.mp4',190,190)},
 word:{u:[2,2],set:'brand refresh tile',bg:'none',pad:43,fam:'fbmark',h:vid('clips/br-word.mp4',190,190)},
 fac:{u:[2,2],set:'brand refresh tile',bg:'none',pad:43,h:vid('clips/br-fac.mp4',190,190)},
 sw:{u:[1,1],set:'.Switch',bg:'none',h:`<div class="swap" style="width:58px;height:44px;display:grid;place-items:center" data-act="switch"><div class="base">${img(V+'switch-on.png',53,36)}</div><div class="alt" style="display:grid;place-items:center">${img(V+'switch-off.png',58,44)}</div></div>`},
 ring:{u:[1,1],set:'Progress Ring',bg:'none',h:img(V+'ring.png',32,32)},
};
/* one small tile per app (rule 5); icons are @2x exports shown at 80 */
for(const a of ['claude','figma','cursor','xcode','testflight','simulator','terminal'])C['app-'+a]={u:[1,1],set:'app',b:'pop',bg:'none',h:img(BP+'app-'+a+'.png',80,80,'pop','border-radius:18px')};
const ST={hex:['glyph-hexstar',64],sta:['star-still',72],uni:['unicorn-still',80],croc:['croc-still',80],fire:['fire',72],wow:['wow',72],love:['love',72],check:['badge-check',64],map:['map',72],market:['glyph-market',64],aheart:['ava-heart',80],abuns:['ava-buns',80]};
for(const [k,[f,s]] of Object.entries(ST))C[k]={u:[1,1],set:'sticker',b:'pop',bg:'none',h:img(FB+f+'.webp',s,s,'pop')};

/* Loop: columns of 7 rows. [key, x, y] in units. Every uncovered cell becomes an empty tile (9c).
   The two Messenger composer tiles and the two wordmark tiles sit at opposite ends of the loop. */
const COLS=[
 {w:4,it:[['keys',0,0],['app-cursor',0,6],['uni',1,6],['app-xcode',2,6],['croc',3,6]]},
 {w:3,it:[['thread',0,0],['sw',0,4],['ring',1,4],['app-claude',2,4],['pill',0,5],['fire',0,6],['wow',1,6],['app-figma',2,6]]},
 {w:2,it:[['word',0,0],['taper',0,2],['fac',0,4],['hex',0,6],['love',1,6]]},
 {w:3,it:[['bars',0,0],['ntf',0,3],['chat',0,5]]},
 {w:3,it:[['line',0,0],['donutc',0,2],['ufi',0,5]]},
 {w:3,it:[['pbc',0,0],['glim',0,2],['bling',0,4],['fp',0,5]]},
 {w:4,it:[['voice',0,0],['b2',0,1],['app-testflight',0,3],['app-simulator',1,3],['app-terminal',2,3],['b3',0,4],['aheart',2,4],['sta',3,4],['abuns',2,5],['market',3,5],['cmp',0,6],['map',3,6]]},
 {w:3,it:[['wm',0,0],['mosaic',0,2],['star',0,4],['check',2,4]]},
];

const track=document.getElementById('track');
const VW=()=>innerWidth,VH=()=>innerHeight;
const TOP=()=>Math.round((VH()-px(ROWS))/2);
let cols=[],loopW=0;
function makeTile(k,uw,uh){const el=document.createElement('div');el.className='t';const W=px(uw),H=px(uh);el.style.width=W+'px';el.style.height=H+'px';
 const t={k,el,w:W,h:H,state:0,gen:0};if(k){el.dataset.k=k;el.dataset.gen='0'}
 if(k){const c=C[k],p=c.pad||PAD;const inn=document.createElement('div');inn.className='in'+(c.bg==='card'?' card':'')+(c.bg==='none'?' bare':'');
  if(c.bg==='white'){inn.classList.add('wm')}
  Object.assign(inn.style,{left:p+'px',top:p+'px',width:(W-2*p)+'px',height:(H-2*p)+'px'});
  inn.innerHTML=`<div class="c">${c.h}</div>`;el.appendChild(inn);}
 return t}
function buildLoop(){let x=0;
 for(const col of COLS){const el=document.createElement('div');el.className='col';const tiles=[];const occ=[...Array(ROWS)].map(()=>Array(col.w).fill(0));
  const place=(t,ux,uy)=>{t.el.style.left=ux*(U+G)+'px';t.el.style.top=uy*(U+G)+'px';t.ux=ux;el.appendChild(t.el);tiles.push(t)};
  for(const [k,ux,uy] of col.it){const [uw,uh]=C[k].u;for(let r=uy;r<uy+uh;r++)for(let q=ux;q<ux+uw;q++){if(occ[r][q])console.warn('overlap',k);occ[r][q]=1}place(makeTile(k,uw,uh),ux,uy)}
  /* empty tiles: one unit each */
  for(let r=0;r<ROWS;r++)for(let q=0;q<col.w;q++){if(occ[r][q])continue;
   const uw=1,uh=1;
   for(let rr=r;rr<r+uh;rr++)for(let qq=q;qq<q+uw;qq++)occ[rr][qq]=1;place(makeTile(null,uw,uh),q,r)}
  const w=px(col.w);track.appendChild(el);cols.push({el,x,w,tiles});x+=w+G}
 loopW=x}

/* timing helpers, cancelled when a tile resets */
const later=(t,ms,fn)=>{const g=t.gen;setTimeout(()=>{if(t.gen===g)fn()},ms)};
const anim=(t,dur,ease,fn)=>{const g=t.gen,t0=performance.now();return new Promise(res=>{const st=now=>{if(t.gen!==g)return res();const p=Math.min(1,(now-t0)/dur);fn(ease(p));p<1?requestAnimationFrame(st):res()};requestAnimationFrame(st)})};
const quart=p=>1-Math.pow(1-p,4),outBold=p=>1-Math.pow(1-p,3);
/* count-up: format-preserving, tabular, never past the final value; covers lift at the end to show the exported digits */
function fmt(final,p){const m=final.match(/^(\D*)([\d,]*\.?\d+)(\D*)$/);if(!m)return final;const[,pre,num,suf]=m;
 const dec=(num.split('.')[1]||'').length,target=parseFloat(num.replace(/,/g,''));let v=Math.min(target,target*p);
 let s=v.toFixed(dec);if(num.includes(',')){const[i,d]=s.split('.');s=i.replace(/\B(?=(\d{3})+(?!\d))/g,',')+(d?'.'+d:'')}return pre+s+suf}
const setCount=(el,p)=>{el.textContent=fmt(el.dataset.count,p)};
const lift=els=>els.forEach(e=>e.style.display='none');
const COUNT_MS=800;   /* SYSTEM GAP fallback: duration.cinematic; count tokens not in the kit yet */

let popQ=0,popT=0;
const BUILD={
 stack(t,fast){const st=t.el.querySelector('.stack');[...st.children].forEach((c,i)=>later(t,fast?0:i*180,()=>{c.classList.add('on');if(i===1){const l=st.querySelector('.tl');if(l)l.style.opacity=1}}))},
 pop(t,fast){const p=t.el.querySelector('.pop');const now=performance.now();if(now-popT>600)popQ=0;popT=now;const d=fast?0:(popQ++)*250;later(t,d,()=>p.classList.add('on'))},
 type(t,fast){const cv=t.el.querySelector('.typecover');if(fast){cv.style.display='none';return}
  cv.style.display='';const n=30;let i=0;const step=()=>{i++;cv.style.clipPath=`inset(0 0 0 ${Math.round(216*i/n)}px)`;if(i<n)later(t,55,step)};later(t,250,step)},
 pbs(t,fast){const rows=[...t.el.querySelectorAll('.row')],cvs=[...t.el.querySelectorAll('.cv')];
  const set=(i,p)=>{rows[i].style.clipPath=`inset(0 ${Math.round(375-74-(318-74+4)*p)}px 0 74px)`;setCount(cvs[i],p)};
  if(fast){rows.forEach((r,i)=>set(i,1));lift(cvs);return}
  rows.forEach((r,i)=>{set(i,0);later(t,i*160,()=>anim(t,COUNT_MS,quart,p=>set(i,p)).then(()=>{if(t.gen)lift([cvs[i]])}))})},
 barv(t,fast){const bars=[...t.el.querySelectorAll('.bar')],cvs=[...t.el.querySelectorAll('.cv')];
  const set=(i,p)=>{const b=bars[i],a=+b.dataset.a,bb=+b.dataset.b;b.style.clipPath=`inset(${Math.round(215-123*p)}px ${375-bb-1}px 33px ${a}px)`};
  if(fast){bars.forEach((b,i)=>set(i,1));lift(cvs);return}
  bars.forEach((b,i)=>{set(i,0);later(t,i*160,()=>anim(t,COUNT_MS,quart,p=>set(i,p)))});
  cvs.forEach(c=>setCount(c,0));anim(t,COUNT_MS+4*160,quart,p=>cvs.forEach(c=>setCount(c,p))).then(()=>lift(cvs))},
 count(t,fast){const cvs=[...t.el.querySelectorAll('.cv')];if(fast){lift(cvs);return}
  cvs.forEach(c=>setCount(c,0));anim(t,COUNT_MS,quart,p=>cvs.forEach(c=>setCount(c,p))).then(()=>lift(cvs))},
 mosaic(t,fast){const ps=[...t.el.querySelectorAll('.p')];
  if(fast){ps.forEach(p=>p.classList.add('on'));return}
  ps.forEach((p,i)=>later(t,i*160,()=>p.classList.add('on')))},
chart(t,fast){const root=t.el.querySelector('.chart'),S=CH[root.dataset.ch],states=[...root.querySelectorAll('.cst')];let i=0;
  const show=k=>{states.forEach((e,j)=>e.classList.toggle('on',j===k));const st=states[k],s=S[k],ovs=[...st.querySelectorAll('.ov')],cvs=[...st.querySelectorAll('.cv')];
   const setR=(j,p)=>{const r=s.rv[j],o=ovs[j];if(r.t==='lr'){const x=r.x0+(r.x1-r.x0)*p;o.style.clipPath=`inset(${r.y0}px ${s.w-x}px ${s.h-r.y1}px ${r.x0}px)`}
     else if(r.t==='up'){const y=r.y1-(r.y1-r.y0)*p;o.style.clipPath=`inset(${y}px ${s.w-r.x1}px ${s.h-r.y1}px ${r.x0}px)`}
     else{const m=p>=1?'none':`conic-gradient(#000 ${p*360}deg, transparent ${p*360}deg)`;o.style.webkitMaskImage=m;o.style.maskImage=m}};
   cvs.forEach(c=>{c.style.display='';setCount(c,fast?1:0)});
   if(fast){s.rv.forEach((r,j)=>setR(j,1));lift(cvs);return}
   s.rv.forEach((r,j)=>{setR(j,0);later(t,j*160,()=>anim(t,COUNT_MS,quart,p=>setR(j,p)))});
   const tot=COUNT_MS+(s.rv.length-1)*160;anim(t,tot,quart,p=>cvs.forEach(c=>setCount(c,p))).then(()=>{if(states[k].classList.contains('on'))lift(cvs)})};
  show(0);if(S.length>1){const cyc=()=>{i=(i+1)%S.length;show(i);later(t,5200,cyc)};later(t,fast?3000:5200,cyc)}},
 ufi(t){},
 glimfp(t,fast){const g=t.el.querySelector('.glimfp');later(t,fast?0:1800,()=>g.classList.add('b'))},
 glim(t,fast){const g=t.el.querySelector('.glim');later(t,fast?0:1800,()=>g.classList.add('b'))},
 voice(t){const w=t.el.querySelector('.wave');if(w)wave(t,w)},
};
function wave(t,w){const L=[...w.children],v=t.el.querySelector('video');const seq=[0,0,1,1,2,1,2,2,1,0,1,2,2,1,1,0,1,2,1,0];let j=0;
 const tick=()=>{const tm=v?v.currentTime:0,on=tm>=2.4&&tm<=6.9;w.classList.toggle('on',on);if(on){const lv=seq[j++%seq.length];L.forEach((m,i)=>m.classList.toggle('on',i===lv))}later(t,150,tick)};tick()}

function reset(t){t.gen++;t.state=0;t.el.classList.remove('glow','built');
 t.el.querySelectorAll('.on').forEach(e=>e.classList.remove('on'));t.el.querySelectorAll('.swap').forEach(e=>e.classList.remove('b'));
 t.el.querySelectorAll('.cv').forEach(e=>{e.style.display='';e.textContent=e.dataset.count});
const tl=t.el.querySelector('.tl');if(tl)tl.style.opacity=0;
 const cv=t.el.querySelector('.typecover');if(cv){cv.style.display='';cv.style.clipPath=''}
 t.el.querySelectorAll('video').forEach(v=>{v.pause();v.currentTime=0});
 t.el.querySelectorAll('.rx').forEach(r=>{r.className='rx';r.querySelectorAll('.ri').forEach(i=>i.classList.remove('h'))});
 t.el.dataset.gen=t.gen}
function enter(t,fast){t.state=2;const e=t.el,c=C[t.k];
 const go=()=>{e.classList.add('built');e.querySelectorAll('video').forEach(v=>{v.currentTime=0;v.play().catch(()=>{})});if(c.b&&BUILD[c.b])BUILD[c.b](t,fast)};
 if(fast){go();return}
 e.classList.add('glow');later(t,300,go)}

/* cursors: one at a time; nearest edge in, real controls, out the same way; each person acts once per tile entry */
const PEOPLE=[['Julie','#8A3FFC'],['Adam','#1DB954'],['Eduardo','#F0284A'],['Jeremy','#0B84FF'],['Josh','#F5A623']];
const tap=(pt,fn,hold=900)=>[{pt,dur:1100,hold,down:true,act:fn}];
const ACTS={
 Julie:{find:'[data-act="switch"]',steps:el=>tap([29,22],()=>el.classList.toggle('b'))},
 Adam:{find:'[data-act="pill"]',steps:el=>tap([218,30],()=>el.classList.toggle('b'))},
 /* Eduardo: press and hold Like (Blueprint pressed state), the dock opens after 350 ms, slide across, release on Haha (prototype gesture) */
 Eduardo:{find:'.rx',steps:el=>{const hl=i=>{el.classList.add('hi');el.querySelectorAll('.ri').forEach((r,j)=>r.classList.toggle('h',j===i))};
   const cx=i=>2.5+1+6+20+46*i,cy=200-44-4-26;
   return [{pt:[40,178],dur:1100,hold:0,down:true,act:()=>{el.classList.add('pr');setTimeout(()=>el.classList.add('open'),350)}},
     {pt:[40,178],dur:450,hold:0},
     {pt:[cx(0),cy],dur:320,hold:240,act:()=>hl(0)},{pt:[cx(1),cy],dur:260,hold:240,act:()=>hl(1)},{pt:[cx(2),cy],dur:260,hold:240,act:()=>hl(2)},
     {pt:[cx(3),cy],dur:260,hold:700,act:()=>hl(3)},
     {pt:[cx(3),cy],dur:10,hold:600,up:true,act:()=>{el.classList.add('closing','sel');el.classList.remove('open','pr','hi');setTimeout(()=>{el.classList.remove('closing');el.querySelectorAll('.ri').forEach(r=>r.classList.remove('h'))},160)}}]}},
 /* Jeremy: one tap on View, Blueprint pressed state (white 30% overlay, scale .97) */
 Jeremy:{find:'.glim.b .alt',steps:el=>tap([191,117],()=>{const b=el.querySelector('.bpress');b.classList.add('down');setTimeout(()=>b.classList.remove('down'),220)})},
 Josh:{find:'.t[data-k="thread"] .stack',steps:el=>tap([124,66],()=>{const p=document.createElement('img');p.src=FB+'love.webp';p.className='rpop';p.style.left='124px';p.style.top='44px';el.appendChild(p);requestAnimationFrame(()=>p.classList.add('go'));setTimeout(()=>p.remove(),1300)})},
};
const svg=c=>`<svg viewBox="0 0 24 24"><path d="M3 2l17 9.2-7.4 1.9L9.6 20z" fill="${c}" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
let curIdx=0,busy=false;
function nextCursor(){if(busy)return;const [name,color]=PEOPLE[curIdx%PEOPLE.length];const a=ACTS[name];curIdx++;
 const el=[...document.querySelectorAll(a.find)].find(e=>{const t=e.closest('.t');if(!t||!t.classList.contains('built'))return false;if(t.dataset['done'+name]===t.dataset.gen)return false;const r=e.getBoundingClientRect();return r.left>120&&r.right<VW()-260&&r.top>60&&r.bottom<VH()-60});
 if(!el)return;
 const tile=el.closest('.t');tile.dataset['done'+name]=tile.dataset.gen;busy=true;
 const steps=a.steps(el);
 const c=document.createElement('div');c.className='cur';c.style.setProperty('--cc',color);c.innerHTML=svg(color)+`<i></i><b style="background:${color}">${name}</b>`;document.body.appendChild(c);
 const at=pt=>{const r=el.getBoundingClientRect();return [r.left+pt[0],r.top+pt[1]]};
 const [fx,fy]=at(steps[0].pt);const dl=fx,dr=VW()-fx,dt=fy,db=VH()-fy,m=Math.min(dl,dr,dt,db);
 const edge=m===dl?[-160,fy]:m===dr?[VW()+60,fy]:m===dt?[fx,-120]:[fx,VH()+60];
 const ease=t=>1-Math.pow(1-t,3),easeIn=t=>t*t*t,inout=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
 let si=0,t0=performance.now(),from=null,phase='move';const OUT=900;
 function frame(now){
  if(si<steps.length){const s=steps[si];const to=at(s.pt);const f=from?at(from):edge;const e=now-t0;
   if(phase==='move'){const k=Math.min(1,e/s.dur),q=si===0?ease(k):inout(k);c.style.transform=`translate(${f[0]+(to[0]-f[0])*q}px,${f[1]+(to[1]-f[1])*q}px)`;
    if(k>=1){phase='hold';t0=now;if(s.down){c.classList.add('press');c.querySelector('i').classList.add('go')}if(s.up)c.classList.remove('press');else if(s.down&&steps.length===1)setTimeout(()=>c.classList.remove('press'),160);if(s.act)s.act()}}
   else{c.style.transform=`translate(${to[0]}px,${to[1]}px)`;if(e>=s.hold){from=s.pt;si++;t0=now;phase='move'}}
   requestAnimationFrame(frame);return}
  const e=now-t0,p=at(from),k=easeIn(Math.min(1,e/OUT));c.style.transform=`translate(${p[0]+(edge[0]-p[0])*k}px,${p[1]+(edge[1]-p[1])*k}px)`;
  if(k<1)requestAnimationFrame(frame);else{c.remove();setTimeout(()=>{busy=false},500)}}
 requestAnimationFrame(frame)}
setInterval(nextCursor,400);

/* motion: one sheet, right to left, 0.06 screen heights a second, whole device pixels */
let x=0,last=performance.now();
buildLoop();
function place(){const top=TOP();for(const c of cols)c.el.style.transform=`translate(${c.x}px,${top}px)`}
place();
for(const c of cols)for(const t of c.tiles)if(t.k){const tx=c.x+parseFloat(t.el.style.left);if(tx+t.w<=VW())enter(t,true)}
function frame(now){const dt=Math.min(.25,(now-last)/1000);last=now;x+=SPEED_H*VH()*dt;
 const d=devicePixelRatio||1;track.style.transform=`translate3d(${-Math.round(x*d)/d}px,0,0)`;
 for(const c of cols){
  if(c.x+c.w-x<-40){c.x+=loopW;c.el.style.transform=`translate(${c.x}px,${TOP()}px)`;c.tiles.forEach(reset)}
  const sx=c.x-x;
  for(const t of c.tiles){if(!t.k||t.state)continue;const tx=sx+parseFloat(t.el.style.left);
   if(tx>=0&&tx+t.w<=VW())enter(t,false)}}   /* nothing populates until the tile is fully in frame */
 requestAnimationFrame(frame)}
requestAnimationFrame(frame);
addEventListener('resize',place);

/* checks: 4a (each Blueprint set once in the loop), families a screen apart, loop wider than the screen */
(()=>{const seen={},pos={};for(const c of cols)for(const t of c.tiles)if(t.k){const s=C[t.k].set;if(!/sticker|app|brand clip|brand refresh/.test(s))seen[s]=(seen[s]||0)+1;
  const f=C[t.k].fam;if(f)(pos[f]=pos[f]||[]).push([t.k,c.x+parseFloat(t.el.style.left),t.w])}
 const dup=Object.entries(seen).filter(([,n])=>n>1);window.__components=seen;if(dup.length)console.warn('REPEATED COMPONENT',dup);
 const fam=[];for(const [f,L] of Object.entries(pos))for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++){const[a,ax,aw]=L[i],[b,bx,bw]=L[j];
  if(f==='fbmark'&&(a==='wm'&&b==='mosaic'||a==='mosaic'&&b==='wm'))continue;
  const g1=Math.max(ax,bx)-(Math.min(ax,bx)+(ax<bx?aw:bw)),g2=loopW-(Math.max(ax,bx)+(ax<bx?bw:aw))+Math.min(ax,bx);fam.push([f,a,b,g1,g2,Math.min(g1,g2)>VW()])}
 window.__families=fam;window.__loopW=loopW;fam.filter(r=>!r[5]).forEach(r=>console.info('same family can share the screen',r));
 if(loopW<VW()+400)console.warn('loop shorter than screen',loopW)})();
</script></body></html>
