<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story Wall · Julie Torrisi-Coffey</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="fonts.css">
<style>
:root{
  --blue:#0866FF; --blue2:#4599FF; --ink:#080809; --gray:#65686C; --wash:#F0F2F5;
  --d-card:#242526; --d-surf:#3A3B3C; --d-line:#3E4042; --d-tx:#E4E6EB; --d-tx2:#B0B3B8;
  --purple:#A873FF; --pink:#F35369; --green:#31A24C; --yellow:#F7B928; --teal:#2ABBA7; --red:#E41E3F; --orange:#F26F21;
  --wall:#0C0D10; --tile:#16171B; --tile-line:rgba(255,255,255,.06);
  --u:116px; --g:16px; --r:22px;
  /* motion tokens */
  --enter:cubic-bezier(.2,.8,.2,1); --leave:cubic-bezier(.4,0,1,1); --move:cubic-bezier(.4,0,.2,1);
  --spring:cubic-bezier(.34,1.56,.64,1); --tray:300ms;
  --ui:"Inter",-apple-system,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--wall);overflow:hidden}
body{font-family:var(--ui);-webkit-font-smoothing:antialiased;color:var(--d-tx)}
img,svg{display:block}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;background:
  radial-gradient(900px 600px at 8% 0%,rgba(8,102,255,.09),transparent 60%),radial-gradient(900px 600px at 96% 100%,rgba(168,115,255,.08),transparent 60%),var(--wall)}
.track{position:absolute;top:20px;left:0;display:flex;gap:var(--g);will-change:transform}
.set{display:grid;grid-template-rows:repeat(8,var(--u));grid-auto-columns:var(--u);grid-auto-flow:column dense;gap:var(--g)}
.w1{grid-column:span 1}.w2{grid-column:span 2}.w3{grid-column:span 3}.w4{grid-column:span 4}.w5{grid-column:span 5}
.h1{grid-row:span 1}.h2{grid-row:span 2}.h3{grid-row:span 3}.h4{grid-row:span 4}

/* ---------- Card lifecycle: frame appears on the right, then the component builds in ---------- */
.t{position:relative;border-radius:var(--r);background:var(--tile);border:1px solid var(--tile-line);overflow:hidden;display:grid;place-items:center;
  opacity:0;transform:scale(.94);transition:opacity .45s var(--enter),transform .45s var(--enter)}
.t::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 0 1.5px var(--blue2);opacity:0}
.t.shown{opacity:1;transform:none}
.t.shown::after{animation:sel .9s var(--move) .1s}
@keyframes sel{0%{opacity:0}25%{opacity:.9}100%{opacity:0}}
.t>.c{position:relative;width:100%;height:100%;display:grid;place-items:center;opacity:0;transform:translateY(14px) scale(.97);transition:opacity .5s var(--enter),transform .5s var(--enter)}
.t.built>.c{opacity:1;transform:none}

/* ---------- Facebook icon: tap, open to the loading screen, settle ---------- */
.fbi{width:150px;height:150px;border-radius:36px;background:var(--blue);display:grid;place-items:center;box-shadow:0 20px 50px rgba(8,102,255,.45)}
.fbi svg{width:150px;height:150px}
.built .fbi{animation:fbtap 5s var(--move) infinite}
@keyframes fbtap{0%,10%{transform:scale(1)}14%{transform:scale(.86)}20%{transform:scale(1.04)}24%,100%{transform:scale(1)}}
.splash{position:absolute;inset:0;background:#fff;display:grid;place-items:center;clip-path:circle(0% at 50% 50%)}
.splash svg{width:84px;height:84px;opacity:0}
.built .splash{animation:splash 5s var(--enter) infinite}
.built .splash svg{animation:splashf 5s var(--spring) infinite}
@keyframes splash{0%,22%{clip-path:circle(0% at 50% 50%)}34%,56%{clip-path:circle(75% at 50% 50%)}68%,100%{clip-path:circle(0% at 50% 50%)}}
@keyframes splashf{0%,26%{transform:scale(.3);opacity:0}38%,54%{transform:scale(1);opacity:1}62%,100%{transform:scale(.6);opacity:0}}

/* ---------- Title-slide flower + reactions ---------- */
.flw{position:relative;width:100%;height:100%}
.flw .fl{position:absolute;left:50%;top:50%;width:250px;height:250px;margin:-125px}
.built .flw .fl{animation:spin 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.flw img{position:absolute;border-radius:50%;transform:scale(0);filter:drop-shadow(0 12px 20px rgba(0,0,0,.45))}
.flw .r1{width:84px;left:8%;top:58%}.flw .r2{width:72px;left:70%;top:8%}.flw .r3{width:46px;left:74%;top:72%}
.built .flw img{animation:rin 6s var(--spring) infinite}
.built .flw .r2{animation-delay:.2s}.built .flw .r3{animation-delay:.4s}
@keyframes rin{0%,6%{transform:scale(0) rotate(-25deg)}16%{transform:scale(1.12) rotate(5deg)}22%,84%{transform:scale(1) rotate(0)}94%,100%{transform:scale(0)}}

/* ---------- 3D art: slow float, each a different feel ---------- */
.art{width:80%;height:80%;object-fit:contain;filter:drop-shadow(0 24px 30px rgba(0,0,0,.5))}
.built .art.f1{animation:bob 7s ease-in-out infinite}
.built .art.f2{animation:tilt 8s ease-in-out infinite}
.built .art.f3{animation:drift 9s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(-6px)}50%{transform:translateY(8px)}}
@keyframes tilt{0%,100%{transform:rotate(-5deg) translateY(4px)}50%{transform:rotate(4deg) translateY(-6px)}}
@keyframes drift{0%,100%{transform:translate(-6px,4px)}50%{transform:translate(6px,-6px)}}
.bulbglow{position:absolute;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(120,140,255,.35),transparent 65%);opacity:.4}
.built .bulbglow{animation:glow 3.5s ease-in-out infinite}
@keyframes glow{50%{opacity:1;transform:scale(1.1)}}

/* ---------- Shared bits ---------- */
.av{border-radius:50%;flex:none;background:center/cover}
.sk{display:block;height:9px;border-radius:5px;background:var(--d-surf)}
.sk.hi{background:#4E4F50}

/* ---------- Responsive post: cycles its layouts ---------- */
.post{width:88%;background:var(--d-card);border-radius:18px;overflow:hidden}
.post .hd{display:flex;align-items:center;gap:10px;padding:14px}
.post .hd .av{width:40px;height:40px}
.post .ln{flex:1;display:flex;flex-direction:column;gap:6px}
.post .body{position:relative;overflow:hidden;transition:height .45s var(--move)}
.post .lay{position:absolute;left:0;right:0;top:0;opacity:0;transition:opacity .35s var(--move)}
.post .lay.on{opacity:1}
.post .copy{padding:0 14px 12px;display:flex;flex-direction:column;gap:7px}
.post .ph{background:center/cover}
.post .grid2{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.post .link{margin:0 14px 12px;border-radius:12px;overflow:hidden;background:var(--d-surf)}
.post .link .ph{height:120px}.post .link .copy{padding:10px 12px}
.post .ufi{display:flex;justify-content:space-around;padding:12px 8px;border-top:1px solid var(--d-line)}
.post .ufi svg{width:22px;height:22px;color:var(--d-tx2)}

/* ---------- Media tiles (advanced) ---------- */
.mts{display:flex;gap:4%;width:90%;justify-content:center}
.mt{width:46%;background:var(--d-card);border-radius:14px;overflow:hidden;transition:transform .5s var(--spring)}
.mt .img{position:relative;aspect-ratio:1;background:center/cover}
.mt .badge{position:absolute;left:8px;top:8px;width:34px;height:16px;border-radius:4px;background:var(--red);transform:scale(0);transition:transform .4s var(--spring)}
.mt .dur{position:absolute;right:8px;bottom:8px;width:30px;height:14px;border-radius:4px;background:rgba(0,0,0,.6);opacity:0;transition:opacity .3s}
.mt .play{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:rgba(0,0,0,.5);display:grid;place-items:center;transform:scale(0);transition:transform .4s var(--spring)}
.mt .x{position:absolute;right:8px;top:8px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;opacity:0;transition:opacity .3s}
.mt .bd{padding:10px 10px 12px;display:flex;flex-direction:column;gap:6px}
.mt .st{display:flex;gap:2px}.mt .st b{width:11px;height:11px;background:#E07B00;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.mt .st b.o{background:#55575A}
.mts[data-v="1"] .badge,.mts[data-v="1"] .dur{transform:scale(1);opacity:1}
.mts[data-v="2"] .play{transform:scale(1)}.mts[data-v="2"] .dur{opacity:1}
.mts[data-v="3"] .x{opacity:1}.mts[data-v="3"] .mt:first-child{transform:scale(1.04)}

/* ---------- Bottom nav (Xcode prototype) ---------- */
.tabs{position:relative;width:90%;display:flex;justify-content:space-between;padding:10px 6px 14px}
.tabs span{position:relative;display:grid;place-items:center;width:52px;height:44px;transition:transform .35s var(--spring)}
.tabs svg{width:30px;height:30px;color:var(--d-tx2);transition:color .25s}
.tabs svg .fill{opacity:0;transition:opacity .25s}
.tabs .on svg{color:var(--blue2)}.tabs .on svg .fill{opacity:1}.tabs .on{transform:scale(1.1)}
.tabs .bar{position:absolute;bottom:0;left:0;height:4px;width:52px;border-radius:4px;background:var(--blue2);transition:transform .4s var(--move)}

/* ---------- Switch + toggle cell ---------- */
.sw{position:relative;width:52px;height:30px;border-radius:15px;background:#8A8D91;transition:background .3s var(--move);flex:none}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .35s var(--spring)}
.sw.on{background:var(--blue)}.sw.on::after{transform:translateX(22px)}
.cell{width:88%;display:flex;flex-direction:column;gap:12px}
.cell .r{display:flex;align-items:center;gap:14px;background:var(--d-card);border-radius:16px;padding:12px 16px}
.cell .av{width:48px;height:48px;box-shadow:0 0 0 2px var(--d-card),0 0 0 4px transparent;transition:box-shadow .4s}
.cell .r.lit .av{box-shadow:0 0 0 2px var(--d-card),0 0 0 4px var(--blue)}
.cell .ln{flex:1;display:flex;flex-direction:column;gap:7px}

/* ---------- Numbered badge ---------- */
.bell{position:relative;width:96px;height:96px;border-radius:50%;background:var(--d-surf);display:grid;place-items:center}
.bell svg{width:50px;height:50px;color:var(--d-tx);transform-origin:50% 10%}
.bell.ring svg{animation:ringb .7s var(--move)}
@keyframes ringb{20%{transform:rotate(14deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}80%{transform:rotate(-4deg)}}
.nb{position:absolute;right:-4px;top:-4px;min-width:38px;height:38px;padding:0 9px;border-radius:19px;background:var(--red);color:#fff;font:700 19px/38px var(--ui);text-align:center;
  border:3px solid var(--tile);font-variant-numeric:tabular-nums;transition:transform .35s var(--spring)}
.nb.bump{transform:scale(1.25)}

/* ---------- Reaction dock: press, bling string magnifies, choose, count up ---------- */
.dockw{position:relative;width:90%;height:84%}
.dock{position:absolute;left:0;top:18px;display:flex;gap:6px;padding:8px 10px;border-radius:40px;background:var(--d-card);box-shadow:0 10px 30px rgba(0,0,0,.45);
  transform-origin:20% 100%;transform:scale(.4) translateY(30px);opacity:0;transition:transform .35s var(--spring),opacity .2s}
.dock.open{transform:none;opacity:1}
.dock i{width:46px;height:46px;display:block;transform:scale(0);transition:transform .25s var(--spring)}
.dock.open i{transform:scale(1)}
.dock i svg,.dock i img{width:100%;height:100%}
.dock i.hov{transform:scale(1.5) translateY(-14px)}
.dock i.pick{transform:scale(1.6) translateY(-18px)}
.flyer{position:absolute;width:46px;height:46px;opacity:0;pointer-events:none}
.ubar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:16px;background:var(--d-card)}
.ubtn{display:flex;align-items:center;gap:8px;transition:transform .2s var(--move)}
.ubtn.press{transform:scale(.92)}
.ubtn .ic{position:relative;width:26px;height:26px}
.ubtn .ic>*{position:absolute;inset:0;width:100%;height:100%;transition:transform .35s var(--spring),opacity .2s}
.ubtn .ic .lv{transform:scale(0);opacity:0}
.ubtn.loved .ic .lk{transform:scale(0);opacity:0}.ubtn.loved .ic .lv{transform:scale(1);opacity:1}
.ubtn .sk{width:46px;transition:background .3s}.ubtn.loved .sk{background:var(--pink)}
.cnt{display:flex;align-items:center;gap:8px;font:700 18px/1 var(--ui);font-variant-numeric:tabular-nums}
.cnt .fp{display:flex}.cnt .fp img{width:24px;height:24px;border-radius:50%;border:2px solid var(--d-card)}.cnt .fp img+img{margin-left:-8px}
.cnt b{display:inline-block;transition:transform .3s var(--spring)}.cnt b.bump{transform:scale(1.25)}
.burst{position:absolute;width:12px;height:12px;border-radius:50%;pointer-events:none}

/* ---------- Live reaction stream ---------- */
.stream{position:absolute;inset:0}
.stream .fl{position:absolute;bottom:62px;width:40px;height:40px;pointer-events:none}
.stream .cbox{position:absolute;left:14px;right:14px;bottom:14px;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:24px;background:var(--d-card);font:700 17px/1 var(--ui);font-variant-numeric:tabular-nums}
.stream .cbox img{width:22px;height:22px;border-radius:50%}
@keyframes rise{0%{transform:translate(0,0) scale(.4);opacity:0}12%{transform:translate(var(--dx1),-30px) scale(1.05);opacity:1}100%{transform:translate(var(--dx2),-270px) scale(.8);opacity:0}}

/* ---------- Reactions + stickers ---------- */
.rx1{width:74%;height:74%;object-fit:contain}
.small{width:58%}
.built .beat{animation:beat 1.6s var(--spring) infinite}
@keyframes beat{0%,60%,100%{transform:scale(1)}68%{transform:scale(1.22)}76%{transform:scale(.96)}84%{transform:scale(1.12)}}
.built .popw{animation:popw 2.8s var(--spring) infinite}
@keyframes popw{0%,55%,100%{transform:scale(1)}65%{transform:scale(1.3) rotate(-8deg)}78%{transform:scale(.94)}}
.built .flick{animation:flick 1.2s ease-in-out infinite;transform-origin:50% 90%}
@keyframes flick{0%,100%{transform:scaleY(1) skewX(0)}25%{transform:scaleY(1.08) skewX(-3deg)}50%{transform:scaleY(.95) skewX(2deg)}75%{transform:scaleY(1.05) skewX(-1deg)}}

/* ---------- Facepile ---------- */
.fpile{display:flex;align-items:center}
.fpile>*{display:block;overflow:hidden;width:58px;height:58px;border-radius:50%;border:3px solid var(--tile);margin-left:-16px;opacity:0;transform:translateX(24px) scale(.8);transition:all .45s var(--spring)}
.fpile>*:first-child{margin-left:0}
.built .fpile>*{opacity:1;transform:none}
.fpile .more{display:grid;place-items:center;background:var(--d-surf);font:700 16px/1 var(--ui);color:var(--d-tx)}

/* ---------- Signal badges ---------- */
.sigs{display:flex;gap:22px;align-items:center}
.sigs img{width:56px;height:56px;transform:scale(0) rotate(-30deg);transition:transform .5s var(--spring)}
.built .sigs img{transform:none}
.sigs .pill{display:flex;align-items:center;gap:7px;padding:7px 11px 7px 7px;border-radius:20px;background:rgba(8,102,255,.18);transform:scale(0);transition:transform .5s var(--spring) .25s}
.built .sigs .pill{transform:none}
.sigs .pill svg{width:20px;height:20px}.sigs .pill .sk{width:40px;background:var(--blue2);opacity:.6}

/* ---------- Toasts (instant feedback) ---------- */
.toasts{position:relative;width:100%;height:100%}
.toast{position:absolute;left:50%;top:50%;display:flex;align-items:center;gap:10px;padding:11px 16px 11px 12px;border-radius:12px;background:#fff;box-shadow:0 10px 26px rgba(0,0,0,.4);
  transform:translate(-50%,40px);opacity:0;transition:transform .35s var(--enter),opacity .25s}
.toast.in{transform:translate(-50%,-50%);opacity:1}
.toast.out{transform:translate(-50%,-90px);opacity:0;transition:transform .3s var(--leave),opacity .25s}
.toast .ti{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;transform:scale(0);transition:transform .4s var(--spring) .12s}
.toast.in .ti{transform:scale(1)}
.toast .ti svg{width:15px;height:15px}
.toast .sk{width:130px;background:#CED0D4}

/* ---------- Chips ---------- */
.chips{display:flex;gap:10px}
.chip{display:flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:19px;background:var(--d-surf);transition:background .3s var(--move)}
.chip svg{width:18px;height:18px;color:var(--d-tx);transition:color .3s}
.chip .sk{width:34px;background:#5A5C5E;transition:background .3s}
.chip.on{background:rgba(69,153,255,.22)}.chip.on svg{color:var(--blue2)}.chip.on .sk{background:var(--blue2)}

/* ---------- Charts: draw in on enter, then hold ---------- */
.ch{width:84%}
.ch svg{width:100%;height:auto;overflow:visible}
.grow{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0)}
.growx{transform-box:fill-box;transform-origin:left;transform:scaleX(0)}
.built .grow{animation:grow .9s var(--enter) forwards}
.built .growx{animation:growx .9s var(--enter) forwards}
@keyframes grow{to{transform:scaleY(1)}}
@keyframes growx{to{transform:scaleX(1)}}
.draw{stroke-dasharray:1;stroke-dashoffset:1}
.built .draw{animation:draw 1.6s var(--move) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.dot{transform-box:fill-box;transform-origin:center;transform:scale(0)}
.built .dot{animation:dotin .4s var(--spring) forwards}
@keyframes dotin{to{transform:scale(1)}}
.seg{stroke-dashoffset:1}
.built .seg{animation:draw 1.2s var(--enter) forwards}
.bars{width:86%;display:flex;flex-direction:column;gap:12px}
.bars .r{display:grid;grid-template-columns:auto 1fr 34px;gap:10px;align-items:center;font:600 13px/1 var(--ui);color:var(--d-tx2);font-variant-numeric:tabular-nums}
.bars .tr{height:10px;border-radius:10px;background:var(--d-surf);overflow:hidden}
.bars .tr i{display:block;height:100%;border-radius:10px}
.bars .star{width:14px;height:14px;background:var(--yellow);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.ringw{position:relative;width:150px;height:150px}
.ringw svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringw .v{position:absolute;inset:0;display:grid;place-items:center;font:700 30px/1 var(--ui);color:#fff;font-variant-numeric:tabular-nums}
.arc{stroke-dasharray:1;stroke-dashoffset:1}
.built .arc{animation:arc 1.8s var(--enter) forwards}
@keyframes arc{to{stroke-dashoffset:.18}}
.stars5{position:relative;display:flex;gap:8px}
.stars5 .row{display:flex;gap:8px}
.stars5 .row b{width:40px;height:40px;background:#3A3B3C;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.stars5 .gold{position:absolute;left:0;top:0;overflow:hidden;width:0}
.stars5 .gold b{background:var(--yellow)}
.built .stars5 .gold{animation:gold 1.6s var(--enter) forwards}
@keyframes gold{to{width:calc(40px*4.5 + 8px*4)}}
.donut{width:150px;transform:rotate(-90deg)}

/* ---------- Talk to text ---------- */
.ttt{position:absolute;inset:0;overflow:hidden}
.ttt .thread{position:absolute;left:16px;right:16px;top:16px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.ttt .bub{max-width:80%;padding:10px 14px;border-radius:18px;background:var(--blue);color:#fff;font:400 15px/1.3 var(--ui);transform:scale(.6) translateY(30px);opacity:0;transform-origin:100% 100%;transition:transform .4s var(--spring),opacity .2s}
.ttt .bub.in{transform:none;opacity:1}
.ttt .bub.them{align-self:flex-start;background:var(--d-surf);color:var(--d-tx);transform:none;opacity:1}
.ttt .cb{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--d-card);transition:bottom var(--tray) var(--enter)}
.ttt.rec .cb{bottom:150px}
.ttt .cb>svg{width:26px;height:26px;flex:none;transition:transform .25s var(--spring)}
.ttt .cb .mic.tap{transform:scale(1.35)}
.ttt .fld{flex:1;min-height:40px;border-radius:20px;background:var(--d-surf);display:flex;align-items:center;padding:8px 12px;font:400 15px/1.3 var(--ui);color:var(--d-tx)}
.ttt .fld .w{opacity:0;transform:translateY(4px);display:inline-block;transition:opacity .2s,transform .25s var(--enter);margin-right:4px}
.ttt .fld .w.on{opacity:1;transform:none}
.ttt .send{transition:transform .25s var(--spring)}.ttt .send.tap{transform:scale(1.3)}
.ttt .tray{position:absolute;left:0;right:0;bottom:0;height:150px;background:#1E1F21;display:flex;align-items:center;justify-content:center;gap:16px;transform:translateY(100%);transition:transform var(--tray) var(--enter)}
.ttt.rec .tray{transform:none}
.ttt .bigmic{position:relative;width:64px;height:64px;border-radius:50%;background:var(--blue);display:grid;place-items:center}
.ttt .bigmic::before{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--blue2);opacity:.5;animation:pulse 1.2s ease-out infinite}
@keyframes pulse{from{transform:scale(.9);opacity:.6}to{transform:scale(1.35);opacity:0}}
.ttt .bigmic svg{width:30px;height:30px}
.ttt .wave{display:flex;gap:4px;align-items:center;height:60px}
.ttt .wave i{width:5px;height:6px;border-radius:4px;background:var(--blue2);transition:height .09s linear}

/* ---------- Sticker tray (Xcode prototype capture) ---------- */
.gifw{position:absolute;inset:0;background:#fff}
.gifw img{width:100%;height:100%;object-fit:cover;object-position:top}

/* ---------- My stack ---------- */
.stack{display:flex;gap:14px}
.app{position:relative;width:64px;height:64px;border-radius:17px;display:grid;place-items:center;box-shadow:0 10px 24px rgba(0,0,0,.45);transform:scale(0);transition:transform .5s var(--spring)}
.app svg{width:36px;height:36px}
.built .app{transform:scale(1)}
.app.pulse{animation:apulse .6s var(--move)}
@keyframes apulse{40%{transform:scale(1.14);box-shadow:0 0 0 6px rgba(69,153,255,.25),0 10px 24px rgba(0,0,0,.45)}}
.app.gap{background:transparent!important;border:1.5px dashed rgba(255,255,255,.28);box-shadow:none}

/* ---------- Comment: light, dark, live ---------- */
.cmt{position:absolute;inset:0;padding:30px;display:flex;flex-direction:column;justify-content:center;gap:16px;transition:background .6s var(--move),color .6s var(--move)}
.cmt .streak{position:absolute;inset:-20%;opacity:0;transition:opacity .6s;background:radial-gradient(60% 30% at 50% 50%,rgba(220,210,255,.85),rgba(140,90,255,.55) 45%,transparent 75%),#120a2a;filter:blur(18px);transform:rotate(-28deg)}
.built .cmt .streak{animation:streak 7s ease-in-out infinite alternate}
@keyframes streak{from{transform:rotate(-28deg) translateX(-12%)}to{transform:rotate(-22deg) translateX(12%)}}
.cmt .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.1),rgba(0,0,0,.6));opacity:0;transition:opacity .6s}
.cmt .row{position:relative;display:flex;gap:10px}
.cmt .av{width:44px;height:44px}
.cmt .bb{border-radius:20px;padding:10px 14px;transition:background .6s}
.cmt .nm{font:600 15px/1.25 var(--ui);display:flex;align-items:center;gap:5px}
.cmt .tx{font:400 16px/1.35 var(--ui);margin-top:2px}
.cmt .mn{font-weight:600}
.cmt .meta{display:flex;align-items:center;gap:16px;margin:7px 0 0 14px;font:600 13px/1 var(--ui);transition:color .6s}
.cmt .rx{margin-left:auto;display:flex;align-items:center;gap:6px}.cmt .rx img{width:20px;height:20px;border-radius:50%}
.cmt .reply{margin-left:54px}.cmt .reply .av{width:32px;height:32px}
.cmt .ck{width:14px;height:14px}
.cmt[data-m="light"]{background:#fff;color:var(--ink)}.cmt[data-m="light"] .bb{background:var(--wash)}.cmt[data-m="light"] .meta{color:var(--gray)}.cmt[data-m="light"] .mn{color:var(--blue)}
.cmt[data-m="dark"]{background:var(--d-card);color:var(--d-tx)}.cmt[data-m="dark"] .bb{background:var(--d-surf)}.cmt[data-m="dark"] .meta{color:var(--d-tx2)}.cmt[data-m="dark"] .mn{color:var(--blue2)}
.cmt[data-m="live"]{background:#000;color:#fff}.cmt[data-m="live"] .streak,.cmt[data-m="live"] .scrim{opacity:1}
.cmt[data-m="live"] .bb{background:rgba(255,255,255,.16);backdrop-filter:blur(14px)}.cmt[data-m="live"] .meta{color:rgba(255,255,255,.85)}.cmt[data-m="live"] .mn{color:#fff;text-decoration:underline}

/* ---------- Group nickname: identity swap ---------- */
.nick{width:86%;display:flex;align-items:center;gap:14px;background:var(--d-card);border-radius:16px;padding:12px 16px}
.nick .avs{position:relative;width:50px;height:50px;flex:none}
.nick .avs i{position:absolute;inset:0;border-radius:50%;background:center/cover;transition:transform .5s var(--spring),opacity .4s}
.nick .avs .mask{position:absolute;right:-4px;bottom:-4px;width:22px;height:22px;border-radius:50%;background:var(--purple);border:2px solid var(--d-card);display:grid;place-items:center;transform:scale(0);transition:transform .4s var(--spring) .15s}
.nick .avs .mask svg{width:12px;height:12px}
.nick .names{position:relative;flex:1;height:30px;overflow:hidden}
.nick .names .sk{position:absolute;left:0;top:10px;height:10px;transition:transform .45s var(--enter),opacity .3s}
.nick .n1{width:60%}.nick .n2{width:76%;background:var(--purple)!important;opacity:.7}
.nick[data-s="0"] .a2,.nick[data-s="1"] .a1{transform:scale(.4);opacity:0}
.nick[data-s="1"] .mask{transform:scale(1)}
.nick[data-s="0"] .n2{transform:translateY(30px);opacity:0}.nick[data-s="1"] .n1{transform:translateY(-30px);opacity:0}

/* ---------- Brand refresh: motion + icon families ---------- */
.bvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fam{display:flex;gap:26px;align-items:center}
.fam>*{width:58px;height:58px;transform:scale(0);transition:transform .5s var(--spring)}
.built .fam>*{transform:scale(1)}
.fam svg{width:58px;height:58px}
.fam .gl .f2{opacity:0;transition:opacity .3s}
.fam .gl.filled .f2{opacity:1}.fam .gl.filled .f1{opacity:0}
.fam img{object-fit:contain}


/* ---------- Typing indicator ---------- */
.typing{display:flex;align-items:center;gap:10px}
.typing .av{width:40px;height:40px}
.typing .tb{display:flex;gap:6px;padding:14px 16px;border-radius:20px;background:var(--d-surf)}
.typing .tb i{width:9px;height:9px;border-radius:50%;background:var(--d-tx2)}
.built .typing .tb i{animation:tdot 1.1s ease-in-out infinite}
.built .typing .tb i:nth-child(2){animation-delay:.15s}.built .typing .tb i:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-6px);opacity:1}}
/* ---------- Active status ---------- */
.pres{position:relative}
.pres i{position:absolute;right:0;bottom:2px;width:18px;height:18px;border-radius:50%;background:var(--green);border:3px solid var(--tile);transform:scale(0);transition:transform .4s var(--spring) .3s}
.built .pres i{transform:scale(1)}
.pres i::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--green);opacity:0}
.built .pres i::after{animation:pulse 1.8s ease-out infinite .8s}
/* ---------- Glimmer (loading) ---------- */
.glim{width:72%;display:flex;flex-direction:column;gap:10px}
.glim .g{display:block;height:10px;border-radius:6px;background:linear-gradient(90deg,#2C2D30 0%,#45474B 40%,#2C2D30 80%);background-size:300% 100%}
.glim .g.av{width:36px;height:36px;border-radius:50%}.glim .g.sq{height:70px;border-radius:10px}
.built .glim .g{animation:shim 1.3s linear infinite}
@keyframes shim{from{background-position:150% 0}to{background-position:-150% 0}}
/* ---------- Story ring ---------- */
.story{position:relative;width:84px;height:84px}
.story svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.story .ring{stroke-dasharray:.08 .04}
.built .story .ring{animation:sring 4s var(--move) infinite}
@keyframes sring{0%{stroke-dasharray:.08 .04;transform:rotate(0)}45%{stroke-dasharray:.08 .04;transform:rotate(360deg)}60%,100%{stroke-dasharray:1 0;transform:rotate(360deg)}}
.story svg circle{transform-origin:center;transform-box:fill-box}
.story .av{position:absolute;inset:9px}

/* ---------- Cursors ---------- */
.cursors{position:absolute;inset:0;pointer-events:none;z-index:20}
.cur{position:absolute;left:0;top:0;opacity:0;transition:opacity .35s}
.cur svg{width:26px;height:26px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.cur span{position:absolute;left:18px;top:22px;white-space:nowrap;font:600 15px/1 var(--ui);color:#fff;padding:7px 10px;border-radius:4px 12px 12px 12px;
  transform:scale(0);transform-origin:0 0;transition:transform .4s var(--spring);box-shadow:0 4px 12px rgba(0,0,0,.3)}
.cur.in{opacity:1}.cur.in.named span{transform:scale(1)}
.cur .clk{position:absolute;left:-12px;top:-12px;width:28px;height:28px;border-radius:50%;border:2px solid currentColor;opacity:0}
.cur .clk.go{animation:clk .5s var(--enter)}
@keyframes clk{from{transform:scale(.3);opacity:.9}to{transform:scale(1.4);opacity:0}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.t,.t>.c{opacity:1!important;transform:none!important}}
</style>

<script>
(()=>{
const stage=document.getElementById('stage');
function fit(){const k=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`translate(-50%,-50%) scale(${k})`;}
addEventListener('resize',fit);fit();
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const rnd=(a,b)=>a+Math.random()*(b-a);

/* ---------- build-once markup ---------- */
// line charts with sample data: low / medium / high density, up and down
let seed=7;const sr=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
$$('[data-line]').forEach(el=>{const n=+el.dataset.n,up=el.dataset.line!=='down',dense=el.dataset.line==='dense',H=dense?60:130,W=320;
  const pts=[];for(let i=0;i<n;i++){const t=i/(n-1);let y=up?(1-t)*.75+.1:t*.7+.12;if(dense)y=.5+Math.sin(i*.7)*.18+(sr()-.5)*.35;else y+=(sr()-.5)*.22;pts.push([t*W,Math.max(.04,Math.min(.96,y))*H])}
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const grid=dense?'':`<path d="M0 ${H}H320M0 ${H*.66}H320M0 ${H*.33}H320" stroke="#2C2D30" stroke-width="1"/>`;
  const dots=n<=8?pts.map((p,i)=>`<circle class="dot" cx="${p[0]}" cy="${p[1]}" r="5" fill="#16171B" stroke="${el.dataset.col}" stroke-width="3" style="animation-delay:${.2+i*.22}s"/>`).join(''):'';
  el.innerHTML=`<svg viewBox="0 0 320 ${H}">${grid}<path class="draw" pathLength="1" d="${d}" fill="none" stroke="${el.dataset.col}" stroke-width="${dense?2.5:4}" stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg>`;});
$$('.ttt .wave').forEach(w=>{for(let i=0;i<14;i++)w.insertAdjacentHTML('beforeend','<i></i>')});

const track=document.getElementById('track'),set=document.getElementById('set');

/* ---------- per-card programs: start on build, stop on leave ---------- */
const fmt=(n,suf)=>Math.round(n).toLocaleString()+(suf||'');
function countUp(root){$$('[data-count]',root).forEach(el=>{const to=+el.dataset.count,t0=performance.now(),d=1200;
  (function step(t){const p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,3);el.textContent=fmt(to*e,el.dataset.suf);if(p<1)requestAnimationFrame(step)})(t0);});}
const P={};
const every=(ms,fn)=>{const id=setInterval(fn,ms);return()=>clearInterval(id)};
const later=(list)=>(ms,fn)=>{list.push(setTimeout(fn,ms))};

P['comment']=c=>{const el=c.querySelector('.cmt');const m=['light','dark','live'];let i=0;el.dataset.m='light';return every(2600,()=>{i=(i+1)%3;el.dataset.m=m[i]})};
P['bottom-nav']=c=>{const tb=c.querySelector('[data-tabs]'),it=$$('span',tb),bar=tb.querySelector('.bar');let i=0;
  const place=()=>{bar.style.transform=`translateX(${it[i].offsetLeft}px)`;it.forEach((s,j)=>s.classList.toggle('on',j===i))};place();
  return every(900,()=>{i=(i+1)%it.length;place()})};
P['badge-count']=c=>{const b=c.querySelector('.bell'),nb=b.querySelector('.nb');let n=1;nb.textContent='1';
  return every(850,()=>{n=n>=10?1:n+1;nb.textContent=n>9?'9+':n;nb.classList.add('bump');b.classList.add('ring');setTimeout(()=>{nb.classList.remove('bump');b.classList.remove('ring')},380)})};
P['media-tiles']=c=>{const m=c.querySelector('.mts');let v=0;m.dataset.v=0;return every(1400,()=>{v=(v+1)%4;m.dataset.v=v})};
P['toggle-avatar']=c=>{const rows=$$('[data-tg]',c);let i=0;rows.forEach(r=>{r.classList.remove('lit');r.querySelector('.sw').classList.remove('on')});
  return every(1000,()=>{const r=rows[i%rows.length],s=r.querySelector('.sw'),on=!s.classList.contains('on');s.classList.toggle('on',on);r.classList.toggle('lit',on);i++})};
P['group-nickname']=c=>{const n=c.querySelector('.nick');n.dataset.s='0';return every(2000,()=>{n.dataset.s=n.dataset.s==='0'?'1':'0'})};
P['responsive-post']=c=>{const lays=$$('.lay',c),body=c.querySelector('.body');let i=0;
  const show=()=>{lays.forEach((l,j)=>l.classList.toggle('on',j===i));body.style.height=lays[i].dataset.h+'px'};show();
  return every(2200,()=>{i=(i+1)%lays.length;show()})};
P['chips']=c=>{const ch=$$('.chip',c);let i=0;ch.forEach(x=>x.classList.remove('on'));ch[0].classList.add('on');
  return every(1100,()=>{ch[i].classList.remove('on');i=(i+1)%ch.length;ch[i].classList.add('on')})};
P['my-stack']=c=>{const a=$$('.app',c);a.forEach((x,i)=>x.style.transitionDelay=(i*.14)+'s');let t=[];
  const pulse=()=>a.forEach((x,i)=>t.push(setTimeout(()=>{x.classList.remove('pulse');void x.offsetWidth;x.classList.add('pulse')},i*110)));
  t.push(setTimeout(pulse,1300));const s=every(4200,pulse);return()=>{s();t.forEach(clearTimeout);a.forEach(x=>x.classList.remove('pulse'))}};
P['brand-icons']=c=>{const g=c.querySelector('.gl');return every(1300,()=>g.classList.toggle('filled'))};
P['react-wow']=c=>{const im=c.querySelector('img');im.classList.add('popw');return()=>im.classList.remove('popw')};
P['toasts']=c=>{const host=c.querySelector('.toasts');const kinds=[
  ['#31A24C','<path d="m6 12.5 4 4 8-9" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'],
  ['#0866FF','<path d="M14.5 2 22 9.5l-2.2.6-3.6 3.6.4 5-1.4 1.4-4.3-4.3L5 21.7 3.3 20l5.9-5.9-4.3-4.3 1.4-1.4 5 .4 3.6-3.6z" fill="#fff" transform="scale(.75) translate(4 4)"/>'],
  ['#A873FF','<path d="M7 4h10v17l-5-3.5L7 21z" fill="#fff" transform="scale(.8) translate(3 2)"/>'],
  ['#F26F21','<path d="M10 14a4 4 0 0 0 5.6 0l3-3a4 4 0 0 0-5.6-5.6l-1 1M14 10a4 4 0 0 0-5.6 0l-3 3a4 4 0 0 0 5.6 5.6l1-1" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/>']];
  let k=0,t=[];
  const one=()=>{const [col,ic]=kinds[k++%kinds.length];const el=document.createElement('div');el.className='toast';
    el.innerHTML=`<span class="ti" style="background:${col}"><svg viewBox="0 0 24 24">${ic}</svg></span><span class="sk"></span>`;host.appendChild(el);
    requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('in')));
    t.push(setTimeout(()=>{el.classList.add('out')},1700));t.push(setTimeout(()=>el.remove(),2200));};
  one();const s=every(2400,one);return()=>{s();t.forEach(clearTimeout);host.innerHTML=''}};
P['live-reactions']=c=>{const host=c.querySelector('.stream'),b=host.querySelector('[data-tick]');let n=+b.dataset.tick;
  const srcs=['../img/fb/love.webp','../img/fb/like-still.webp','../img/fb/love.webp','../img/fb/wow.webp','../img/fb/care-still.webp'];
  const spawn=()=>{const im=document.createElement('img');im.className='fl';im.src=srcs[Math.floor(Math.random()*srcs.length)];
    im.style.right=rnd(14,60)+'px';im.style.setProperty('--dx1',rnd(-12,12)+'px');im.style.setProperty('--dx2',rnd(-50,10)+'px');
    im.style.animation=`rise ${rnd(2.2,3).toFixed(2)}s var(--move) forwards`;host.appendChild(im);setTimeout(()=>im.remove(),3100);
    n+=1+Math.floor(Math.random()*3);b.textContent=n.toLocaleString();};
  return every(380,spawn)};
P['reaction-dock']=c=>{const dock=c.querySelector('.dock'),items=$$('i',dock),btn=c.querySelector('.ubtn'),b=c.querySelector('.cnt b'),fly=c.querySelector('.flyer'),w=c.querySelector('.dockw');
  let n=2481,t=[];const at=later(t);
  const run=()=>{dock.classList.remove('open');btn.classList.remove('loved','press');items.forEach(x=>{x.classList.remove('hov','pick');x.style.transitionDelay=''});fly.style.cssText='';
    at(300,()=>btn.classList.add('press'));
    at(520,()=>{btn.classList.remove('press');items.forEach((x,i)=>x.style.transitionDelay=(i*.035)+'s');dock.classList.add('open')});
    const path=[0,1,2,3,4,3,2,1];path.forEach((ix,s)=>at(1000+s*170,()=>{items.forEach(x=>{x.style.transitionDelay='';x.classList.toggle('hov',x===items[ix])})}));
    const tp=1000+path.length*170+120;
    at(tp,()=>{items[1].classList.remove('hov');items[1].classList.add('pick')});
    at(tp+260,()=>{const wr=w.getBoundingClientRect(),ir=items[1].getBoundingClientRect(),br=btn.querySelector('.ic').getBoundingClientRect(),k=wr.width/w.offsetWidth;
      const x0=(ir.left-wr.left)/k,y0=(ir.top-wr.top)/k,x1=(br.left-wr.left)/k-10,y1=(br.top-wr.top)/k-10;
      fly.style.cssText=`left:${x0}px;top:${y0}px;opacity:1;transition:none`;items[1].style.opacity='0';dock.classList.remove('open');
      requestAnimationFrame(()=>requestAnimationFrame(()=>{fly.style.cssText=`left:${x1}px;top:${y1}px;opacity:1;transform:scale(.6);transition:left .38s var(--move),top .38s var(--move),transform .38s var(--move)`}))});
    at(tp+660,()=>{fly.style.opacity='0';items[1].style.opacity='';btn.classList.add('loved');n++;b.textContent=n.toLocaleString();b.classList.add('bump');
      const wr=w.getBoundingClientRect(),br=btn.querySelector('.ic').getBoundingClientRect(),k=wr.width/w.offsetWidth,cx=(br.left-wr.left)/k+13,cy=(br.top-wr.top)/k+13;
      for(let i=0;i<8;i++){const p=document.createElement('span');p.className='burst';p.style.cssText=`left:${cx-6}px;top:${cy-6}px;background:${i%2?'#F35369':'#F7B928'}`;w.appendChild(p);
        const a=i/8*Math.PI*2,r=rnd(26,40);p.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*r}px,${Math.sin(a)*r}px) scale(.2)`,opacity:0}],{duration:520,easing:'cubic-bezier(.2,.8,.2,1)',fill:'forwards'});setTimeout(()=>p.remove(),560)}});
    at(tp+960,()=>b.classList.remove('bump'));};
  run();const s=every(5200,()=>{t.forEach(clearTimeout);t.length=0;run()});return()=>{s();t.forEach(clearTimeout)}};
P['talk-to-text']=c=>{const tt=c.querySelector('.ttt'),mic=tt.querySelector('.mic'),fld=tt.querySelector('.fld'),send=tt.querySelector('.send'),me=tt.querySelector('.bub.me'),bars=$$('.wave i',tt);
  const words='Parking now, two minutes away'.split(' ');let t=[],wv=null;const at=later(t);
  const run=()=>{tt.classList.remove('rec');fld.innerHTML='';me.classList.remove('in');me.textContent='';clearInterval(wv);bars.forEach(b=>b.style.height='6px');
    at(500,()=>mic.classList.add('tap'));at(760,()=>{mic.classList.remove('tap');tt.classList.add('rec');
      wv=setInterval(()=>bars.forEach((b,i)=>b.style.height=(6+Math.abs(Math.sin(Date.now()/140+i*.9))*rnd(14,46))+'px'),90)});
    words.forEach((w,i)=>at(1200+i*380,()=>{const s=document.createElement('span');s.className='w';s.textContent=w;fld.appendChild(s);requestAnimationFrame(()=>s.classList.add('on'))}));
    const te=1200+words.length*380+250;
    at(te,()=>{tt.classList.remove('rec');clearInterval(wv)});
    at(te+420,()=>send.classList.add('tap'));
    at(te+640,()=>{send.classList.remove('tap');me.textContent=words.join(' ');fld.innerHTML='';me.classList.add('in')});};
  run();const s=every(6600,()=>{t.forEach(clearTimeout);t.length=0;run()});return()=>{s();t.forEach(clearTimeout);clearInterval(wv)}};

/* ---------- glide: right to left, at Eduardo's card rate ----------
   One set of cards. Each card is placed by its own x, and wraps to the far right only after it has fully left on the left,
   so a card is never on screen twice and nothing pops at the loop seam. */
const cards=[...$$('.t',set)];
let x=0,last=performance.now(),W=0,SPEED=60;const state=new Map();const VW=1920;
function measure(){const n=cards.length;
  cards.forEach(c=>state.set(c,{x0:c.offsetLeft,y0:c.offsetTop,w:c.offsetWidth,h:c.offsetHeight,ph:0,stop:null,timer:null,sx:0}));
  W=set.scrollWidth+16;
  set.style.cssText=`display:block;position:relative;width:${VW}px;height:1040px`;
  state.forEach((s,c)=>{c.style.position='absolute';c.style.left='0';c.style.top=s.y0+'px';c.style.width=s.w+'px';c.style.height=s.h+'px';});
  SPEED=+(0.66*W/n).toFixed(1); // Eduardo: 0.30 m/s, 92.4 m for 204 cards = 0.66 cards per second
  window.__wall={cards:n,loopPx:Math.round(W),speed:SPEED,lapSec:Math.round(W/SPEED)};}
function lifecycle(){state.forEach((s,c)=>{const sx=((s.x0+x+s.w)%W+W)%W-s.w;s.sx=sx;
  c.style.translate=`${sx+20}px 0`;
  if(s.ph===0&&sx+20<VW-8){s.ph=1;c.classList.add('shown');
    s.timer=setTimeout(()=>{s.ph=2;c.classList.add('built');countUp(c);const p=P[c.dataset.k];if(p&&!reduce)s.stop=p(c);},520);}
  else if(s.ph>0&&sx+20>=VW){clearTimeout(s.timer);s.stop&&s.stop();s.stop=null;s.ph=0;c.classList.remove('shown','built');}});}
let ready=false;
addEventListener('load',()=>{if(!ready){measure();ready=true}});setTimeout(()=>{if(!ready){measure();ready=true}},400);
function tick(t){const dt=Math.min(.25,(t-last)/1000);last=t;
  if(ready){if(!reduce)x-=SPEED*dt;lifecycle();moveCursors(dt);}
  requestAnimationFrame(tick);}
requestAnimationFrame(tick);

/* ---------- Figma cursors: enter from the nearest edge, visit a card, leave the way they came ---------- */
const people=[['Julie','#A259FF'],['Adam','#0ACF83'],['Eduardo','#FF7262'],['Jeremy','#1ABCFE'],['Josh','#F5B400']];
const host=document.getElementById('cursors');
const curs=people.map(([n,c])=>{const d=document.createElement('div');d.className='cur';d.style.color=c;
  d.innerHTML=`<i class="clk"></i><svg viewBox="0 0 24 24"><path d="M3 2l7.5 19 2.6-7.6L21 10.6z" fill="${c}" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg><span style="background:${c};${n==='Josh'?'color:#1a1a1a':''}">${n}</span>`;
  host.appendChild(d);return {d,busy:false,x:0,y:0,follow:false,anim:null};});
let order=0;
function moveCursors(dt){curs.forEach(k=>{if(k.follow){k.x-=SPEED*dt;k.d.style.transform=`translate(${k.x}px,${k.y}px)`;}})}
function glide(k,x,y,ms,ease){return new Promise(res=>{const x0=k.x,y0=k.y,t0=performance.now();
  (function f(t){const p=Math.min(1,(t-t0)/ms),e=ease(p);k.x=x0+(x-x0)*e;k.y=y0+(y-y0)*e;k.d.style.transform=`translate(${k.x}px,${k.y}px)`;p<1?requestAnimationFrame(f):res()})(t0);});}
const easeIO=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2,easeOut=p=>1-Math.pow(1-p,3),easeIn=p=>p*p*p;
async function visit(){const free=curs.filter(k=>!k.busy);if(!free.length||curs.filter(k=>k.busy).length>=2)return;
  const k=curs[order++%curs.length];if(k.busy)return;k.busy=true;
  // pick a card in the middle of the screen
  const cand=[...state].filter(([c,s])=>s.ph===2&&s.sx>240&&s.sx+s.w<1640);if(!cand.length){k.busy=false;return}
  const [card,s]=cand[Math.floor(Math.random()*cand.length)];const r=card.getBoundingClientRect(),sr=stage.getBoundingClientRect(),sc=sr.width/1920;
  const tx=s.sx+20+s.w*rnd(.35,.7),ty=20+s.y0+s.h*rnd(.35,.7);
  // nearest edge
  const dl=tx,dr=1920-tx,dtp=ty,db=1080-ty,m=Math.min(dl,dr,dtp,db);
  const [ex,ey]=m===dtp?[tx+rnd(-60,60),-50]:m===db?[tx+rnd(-60,60),1130]:m===dl?[-50,ty+rnd(-40,40)]:[1970,ty+rnd(-40,40)];
  k.x=ex;k.y=ey;k.d.style.transform=`translate(${ex}px,${ey}px)`;k.d.classList.add('in');
  await glide(k,tx-SPEED*1.1,ty,1100,easeOut);k.d.classList.add('named');k.follow=true;
  setTimeout(()=>{const ck=k.d.querySelector('.clk');ck.classList.remove('go');void ck.offsetWidth;ck.classList.add('go')},500);
  await new Promise(r=>setTimeout(r,rnd(2200,3200)));
  k.follow=false;k.d.classList.remove('named');
  const back=m===dtp?[k.x+rnd(-40,40),-60]:m===db?[k.x+rnd(-40,40),1140]:m===dl?[-60,k.y]:[1980,k.y];
  await glide(k,back[0],back[1],900,easeIn);k.d.classList.remove('in');k.busy=false;}
if(!reduce){setTimeout(visit,1800);setInterval(visit,2600);}
})();
